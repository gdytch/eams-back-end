services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ams_app
    restart: unless-stopped
    tty: true
    environment:
      - TZ=Asia/Manila
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:?Set DB_DATABASE in .env}
      - DB_USERNAME=${DB_USERNAME:?Set DB_USERNAME in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
    volumes:
      - .:/var/www
    networks:
      - ams_network
    depends_on:
      db:
        condition: service_healthy
  # Queue Worker
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ams_queue
    mem_limit: 1400m
    environment:
      - TZ=Asia/Manila
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:?Set DB_DATABASE in .env}
      - DB_USERNAME=${DB_USERNAME:?Set DB_USERNAME in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=600 --memory=1400
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - ams_network
    user: www-data
  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: ams_webserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:1348:80"
    environment:
      - TZ=Asia/Manila
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ams_network

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: ams_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3308}:3306"
    environment:
      TZ: Asia/Manila
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    command: --default-time-zone='+08:00'
    networks:
      - ams_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Database Management (phpMyAdmin) - dev only, run with --profile dev
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ams_phpmyadmin
    restart: unless-stopped
    profiles:
      - dev
      - local
      - development
    ports:
      - "127.0.0.1:${PMA_HOST_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    depends_on:
      - db
    networks:
      - ams_network

# Networks
networks:
  ams_network:
    driver: bridge

# Volumes
volumes:
  dbdata:
    driver: local
