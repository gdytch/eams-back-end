services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ams_app
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www
    networks:
      - laravel

  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: ams_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: ams_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret_user_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  # Database Management (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ams_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret_root_password
    depends_on:
      - db
    networks:
      - laravel

# Networks
networks:
  laravel:
    driver: bridge

# Volumes
volumes:
  dbdata:
    driver: local
