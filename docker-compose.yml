services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ams_app
    restart: unless-stopped
    tty: true
    environment:
      - TZ=Asia/Manila
    volumes:
      - .:/var/www
    networks:
      - ams_network
    depends_on:
      db:
        condition: service_healthy
  # Queue Worker
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ams_queue
    mem_limit: 1400m
    environment:
      - TZ=Asia/Manila
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=600 --memory=1400
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - ams_network
    user: www-data
  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: ams_webserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:1348:80"
    environment:
      - TZ=Asia/Manila
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ams_network

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: ams_db
    restart: unless-stopped
    ports:
      - "3308:${DB_PORT:-3306}"
    environment:
      TZ: Asia/Manila
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root_password}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_user_password}
    volumes:
      - dbdata:/var/lib/mysql
    command: --default-time-zone='+08:00'
    networks:
      - ams_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Database Management (phpMyAdmin) - dev only, run with --profile dev
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ams_phpmyadmin
    restart: unless-stopped
    profiles:
      - dev
      - local
      - development
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: ${DB_PORT:-3306}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root_password}
    depends_on:
      - db
    networks:
      - ams_network

# Networks
networks:
  ams_network:
    driver: bridge

# Volumes
volumes:
  dbdata:
    driver: local
