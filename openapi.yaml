openapi: 3.0.3
info:
  title: Event Management System (EMS) API
  description: >
    API-only backend for the Event Management System. Multi-organization tenant
    model: every resource except `User` (Super Admins have no organization) is scoped to the
    caller's organization automatically — Super Admins see across all organizations, everyone
    else only ever sees their own. Cross-organization access to a scoped resource returns
    `404 Not Found` (not `403`), since the record is filtered out of the query entirely.
  version: "1.0.0"
servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Organizations
    description: Super Admin only.
  - name: Users
  - name: Territories
    description: Unions and Missions.
  - name: Attendees
  - name: Events
  - name: Event Sessions
  - name: Event Program
  - name: Speakers
  - name: Event Registrations
  - name: Attendance
  - name: Reports
  - name: Audit Logs
  - name: System Logs
    description: Super Admin only.
  - name: Search
  - name: Public
    description: No authentication unless stated.

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    {
                      type: string,
                      description: "Sanctum personal access token — send as `Authorization: Bearer <token>` on every subsequent request.",
                    }
                  user: { $ref: "#/components/schemas/User" }
        "422":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Logged out." }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/sso/{provider}:
    post:
      tags: [Auth]
      summary: Single Sign-On via OAuth token exchange
      description: >
        Authenticate using OAuth credentials from Google, Microsoft, or Facebook.
        The client obtains an OAuth access token from the provider's native SDK
        and exchanges it with this endpoint for a Sanctum bearer token.

        A new user is created with no Attendee and no `organization_id`. When the provider vouches for the
        email (Google, verified), the email is marked verified and the user is linked at once to every Attendee
        without a login that has that email, across all events (see "Linking rule" in the event-scoped
        registration spec). Other providers leave the email unverified, so nothing is linked.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth provider name
          schema:
            type: string
            enum: [google, microsoft, facebook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: OAuth access token from the provider
                invite_token:
                  type: string
                  nullable: true
                  description: Optional Attendee invite token. When it belongs to an Attendee with the signed-in email, the email counts as verified and the link runs. Event invite tokens are ignored.
      responses:
        "201":
          description: New user created and authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Sanctum personal access token" }
                  user: { $ref: "#/components/schemas/User" }
                  is_new_user: { type: boolean, example: true }
        "200":
          description: Existing user authenticated (email match or identity link)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Sanctum personal access token" }
                  user: { $ref: "#/components/schemas/User" }
                  is_new_user: { type: boolean, example: false }
        "401":
          description: Unable to verify SSO token with provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Unable to verify SSO token." }
        "404":
          description: Unknown provider
        "422":
          description: Provider did not return email or other validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      description: >
        Create a new user account (no Attendee, no `organization_id`) and obtain a bearer token.
        An email verification notification is sent unless the email is verified by `invite_token`.


        **Linking rule**: an Attendee without a login is linked to the user only once the user's email is
        verified. Signing up with an email that matches an Attendee does not link it. Verifying the email
        (`GET /auth/email/verify/{id}/{hash}`, SSO, or using an invite link) links every Attendee without a
        login that has that email, across all events, skipping events where the user already has an
        Attendee. Each link is audited as `attendee.linked`.


        **Attendee invitation**: an Attendee invite token (30-day expiry) whose Attendee has the submitted
        `email` marks the email verified and links at once. A token for another email does not verify.
        An event invite token is accepted and has no effect on linking.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, password_confirmation]
              properties:
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    format: password,
                    minLength: 8,
                    description: "Must be at least 8 characters. `password_confirmation` is required.",
                  }
                password_confirmation: { type: string, format: password, minLength: 8 }
                invite_token:
                  {
                    type: string,
                    nullable: true,
                    description: "Attendee invite token (not expired, Attendee has no login) or an event invite token. Anything else is rejected with a 422 on `invite_token`.",
                  }
      responses:
        "201":
          description: Account created and authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    {
                      type: string,
                      description: "Sanctum personal access token — send as `Authorization: Bearer <token>` on every subsequent request.",
                    }
                  user: { $ref: "#/components/schemas/User" }
        "422":
          description: Validation failed (duplicate user email, weak password, missing fields, unknown/expired invite_token, etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: >
        Initiate password reset for an account.
        If the email exists, a password reset link is sent to the email address.
        Always returns 200 regardless of whether the email exists (to prevent user enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Password reset link sent (or email not found, but response is always 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "If an account exists with that email, a password reset link has been sent.",
                    }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with a valid token
      description: >
        Complete the password reset process using the token from the email link.
        Upon success, all existing Sanctum tokens are revoked to force re-login on all devices.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string, description: "Password reset token from the email link" }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    { type: string, example: "Your password has been successfully reset." }
        "422":
          description: Invalid token, email mismatch, or validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      summary: Verify email address with signed link
      description: >
        Complete email verification using the signed link sent to the user's email.
        Link contains `id`, `hash`, `expires`, and `signature` query parameters — all are required.
        No authentication required; the signature validates the request.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: User ID
        - name: hash
          in: path
          required: true
          schema: { type: string }
          description: Email verification hash (SHA1)
        - name: expires
          in: query
          required: true
          schema: { type: integer }
          description: Expiration timestamp (Unix)
        - name: signature
          in: query
          required: true
          schema: { type: string }
          description: Signed URL signature
      responses:
        "200":
          description: Email verified successfully (or already verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Email verified successfully.",
                      enum:
                        [
                          "Email verified successfully.",
                          "Email already verified.",
                        ],
                    }
        "400":
          description: Invalid hash or signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Invalid verification link." }
        "403":
          description: Link has expired or signature is invalid
        "404":
          description: User not found

  /auth/email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend verification email
      description: >
        Send a new verification email to the authenticated user.
        Returns 200 if already verified (no-op); returns 200 and resends if not yet verified.
      responses:
        "200":
          description: Verification email sent or already verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      enum:
                        [
                          "Verification link sent to your email.",
                          "Email already verified.",
                        ],
                    }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/invite/{token}:
    get:
      tags: [Auth]
      summary: Get user invitation details
      description: >
        Retrieve the details of a pending user invitation. Public endpoint (no authentication required).
        Returns email, role, and organization name for the invitee to view before accepting.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: User invitation token
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
                  role: { $ref: "#/components/schemas/UserRole" }
                  organization: { type: string, nullable: true }
        "404":
          description: Invalid or expired invitation token

  /auth/accept-invite:
    post:
      tags: [Auth]
      summary: Accept user invitation and create account
      description: >
        Accept a pending user invitation and complete account creation.
        The invitee provides their name, password, and the invitation token/email.
        Public endpoint (no authentication required).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, first_name, last_name, password]
              properties:
                token: { type: string, description: "Invitation token from invite email" }
                email: { type: string, format: email, description: "Email must match the invitation" }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password, minLength: 8 }
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    {
                      type: string,
                      description: "Sanctum personal access token — send as `Authorization: Bearer <token>` on every subsequent request.",
                    }
                  user: { $ref: "#/components/schemas/User" }
        "422":
          description: Invalid invitation token, mismatched email, or validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /attendee/dashboard:
    get:
      tags: [Auth]
      summary: Get the authenticated attendee's dashboard
      description: >
        **Access Policy:** Attendee users only (self-scoped; all user roles with attendee profile can access).

        Returns self-scoped dashboard data including profile, account info, upcoming events (sorted by start date,
        soonest first) with next session details and QR token, past events (sorted by end date, most recent first)
        with attendance summaries, spotlight cards for next upcoming event and latest past event, and comprehensive
        statistics including attendance rate percentage. Returns an empty profile if the user has no linked Attendee
        master record yet.
      responses:
        "200": { $ref: "#/components/responses/AttendeeDashboardItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dashboard:
    get:
      tags: [Reports]
      summary: Get the authenticated staff user's home dashboard (single entry point, shape varies by role)
      description: >
        **Access Policy:** Any authenticated staff user (`super_admin`, `org_admin`, `checker`).
        Attendee accounts get `403 Forbidden` — use `GET /attendee/dashboard` instead.

        This is the one-stop "home screen" endpoint the frontend should call right after login;
        the response body shape depends on the caller's `role` (see `discriminator`), so no prior
        knowledge of the user's role or organization id is required:

        - **`super_admin`** → [`SuperAdminHomeDashboard`](#/components/schemas/SuperAdminHomeDashboard):
          cross-organization totals, a top-5 organizations leaderboard (by registrations),
          the next 5 upcoming events platform-wide, a 5-event check-in rate trend, and the
          latest 10 audit log entries system-wide.
        - **`org_admin`** → [`OrgAdminHomeDashboard`](#/components/schemas/OrgAdminHomeDashboard):
          totals scoped to the caller's organization, today's scheduled sessions with live
          check-in/check-out progress, upcoming events, a 5-event check-in rate trend,
          registration breakdowns by union/mission, and the latest 10 audit log entries for
          the organization.
        - **`checker`** → [`CheckerHomeDashboard`](#/components/schemas/CheckerHomeDashboard):
          operational, scanning-focused view — whether the checker is restricted to specific
          events (`event_checker_access`) or has full org access, today's sessions to scan,
          upcoming events, and the checker's own scan activity (today/all-time counts plus the
          last 10 scans they personally recorded).

        All three variants share a common `role`, `user`, and `generated_at` envelope.
      responses:
        "200":
          description: OK — shape depends on `role`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SuperAdminHomeDashboard" }
                  - { $ref: "#/components/schemas/OrgAdminHomeDashboard" }
                  - { $ref: "#/components/schemas/CheckerHomeDashboard" }
                discriminator:
                  propertyName: role
                  mapping:
                    super_admin: "#/components/schemas/SuperAdminHomeDashboard"
                    org_admin: "#/components/schemas/OrgAdminHomeDashboard"
                    checker: "#/components/schemas/CheckerHomeDashboard"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Organizations
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: Super Admin only.
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/OrganizationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Organizations]
      summary: Create an organization
      description: Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, maxLength: 255 }
                code:
                  {
                    type: string,
                    maxLength: 50,
                    description: "Unique short code.",
                  }
                logo_path: { type: string, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        "201": { $ref: "#/components/responses/OrganizationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /organizations/{organization}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      summary: Get an organization
      responses:
        "200": { $ref: "#/components/responses/OrganizationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Organizations]
      summary: Update an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50 }
                logo_path: { type: string, nullable: true }
                is_active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/OrganizationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Organizations]
      summary: Delete an organization
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      summary: List users
      description: >
        Super Admin sees all users; everyone else sees only their own organization's users.
        Users with `role = attendee` are never listed, whatever the `role` filter.
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/UserList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Create a user
      description: >
        Super Admin or Org Admin only. `organization_id` is required when a Super Admin creates
        a non-Super-Admin user; otherwise it defaults to the actor's own organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role: { $ref: "#/components/schemas/UserRole" }
                organization_id: { type: integer, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get a user
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role: { $ref: "#/components/schemas/UserRole" }
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{user}/photo:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Upload a user's profile photo
      description: >
        Creates 4 WebP images (sm/md/lg/original) from the uploaded PNG/JPEG.
        Org Admin+ can upload photos for any user in their organization; users can upload their own.
        Supports both multipart file uploads and base64 input (with or without data-URI prefix).
        Decoded size must not exceed 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: PNG or JPEG image file
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  description: "Base64-encoded PNG/JPEG, optionally prefixed with data-URI (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Users]
      summary: Remove a user's profile photo
      description: Deletes all 4 image sizes. Org Admin+ can remove for their organization users; users can remove their own.
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/invite:
    post:
      tags: [Users]
      summary: Invite a new user by email
      description: >
        Super Admin or Org Admin only. Creates a pending user account and sends an invitation email.
        The invitee will receive a link to accept the invitation and complete their account setup with name and password.
        `organization_id` is required when a Super Admin creates a non-Super-Admin user; otherwise it defaults to the actor's own organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/UserRole" }
                organization_id: { type: integer, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /users/{user}/event-access:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Users]
      summary: Replace a Checker's restricted event list
      description: >
        Syncs the `event_checker_access` pivot for this user. An empty `event_ids` array means
        the Checker defaults back to full access to every event in their organization (this is
        also the default for a brand-new Checker with no rows at all). Super Admins and Org
        Admins always have full access regardless of this list. Newly granting an archived
        event returns 403 `This event is archived.`; archived events already assigned are
        kept even when left out of `event_ids`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_ids]
              properties:
                event_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: The events the user is now restricted to (empty = unrestricted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /users/{user}/resend-invite:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Resend invitation email for a pending user
      description: >
        Super Admin or Org Admin only. Generates a new invitation token and resends the invitation email.
        Only works for users with pending invitations (not yet accepted).
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: User invitation already accepted or other validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /users/{user}/cancel-invite:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Users]
      summary: Cancel a pending user invitation
      description: >
        Super Admin or Org Admin only. Deletes a pending user account and cancels the invitation.
        Only works for users with pending invitations (not yet accepted).
      responses:
        "204": { description: Invitation cancelled and user deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: User invitation already accepted or other error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ---------------------------------------------------------------- Unions
  /unions:
    get:
      tags: [Territories]
      summary: List unions
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/UnionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Territories]
      summary: Create a union
      description: "`organization_id` is required for Super Admins; otherwise defaults to the actor's organization."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                organization_id: { type: integer, nullable: true }
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/UnionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /unions/{union}:
    parameters:
      - $ref: "#/components/parameters/UnionId"
    get:
      tags: [Territories]
      summary: Get a union
      responses:
        "200": { $ref: "#/components/responses/UnionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Territories]
      summary: Update a union
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/UnionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Territories]
      summary: Delete a union
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Missions
  /missions:
    get:
      tags: [Territories]
      summary: List missions
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/MissionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Territories]
      summary: Create a mission
      description: "`union_id` must belong to the resolved organization. `organization_id` is required for Super Admins."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [union_id, name]
              properties:
                organization_id: { type: integer, nullable: true }
                union_id: { type: integer }
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/MissionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /missions/{mission}:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    get:
      tags: [Territories]
      summary: Get a mission
      responses:
        "200": { $ref: "#/components/responses/MissionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Territories]
      summary: Update a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                union_id: { type: integer }
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/MissionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Territories]
      summary: Delete a mission
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Churches
  /churches:
    get:
      tags: [Territories]
      summary: List churches
      parameters:
        - $ref: "#/components/parameters/Page"
        - { name: mission_id, in: query, schema: { type: integer } }
        - name: unverified
          in: query
          description: Only unverified churches. Honoured for org_admin and super_admin only.
          schema: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/ChurchList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Territories]
      summary: Create a church
      description: |
        The mission must belong to the union. A church is identified by normalized name plus normalized address
        (case-insensitive, trimmed, whitespace collapsed) within its mission. Churches created by org_admin or
        super_admin are verified on creation; others start unverified.
        Same name and address: 422 with `existing_church`. Same name, other address: 422 with `existing_churches`
        unless `confirm_same_name` is true. A similar name creates the church and returns `similar_churches`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [union_id, mission_id, name, address]
              properties:
                organization_id: { type: integer }
                union_id: { type: integer }
                mission_id: { type: integer }
                name: { type: string, maxLength: 255 }
                address: { type: string, maxLength: 255 }
                confirm_same_name: { type: boolean }
      responses:
        "201":
          description: Created. `similar_churches` lists churches with a similar name in the mission ("Did you mean...?").
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Church" }
                  similar_churches:
                    type: array
                    items: { $ref: "#/components/schemas/Church" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /churches/{church}:
    parameters:
      - $ref: "#/components/parameters/ChurchId"
    get:
      tags: [Territories]
      summary: Get a church
      responses:
        "200": { $ref: "#/components/responses/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Territories]
      summary: Update a church
      description: Also accepts `PATCH`. `address`, when sent, is required. Same duplicate rules as create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id: { type: integer }
                union_id: { type: integer }
                mission_id: { type: integer }
                name: { type: string, maxLength: 255 }
                address: { type: string, maxLength: 255 }
                confirm_same_name: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Territories]
      summary: Delete a church
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /churches/{church}/verify:
    parameters:
      - $ref: "#/components/parameters/ChurchId"
    post:
      tags: [Territories]
      summary: Verify a church
      description: org_admin of the organization or super_admin. 422 when the church has no address.
      responses:
        "200": { $ref: "#/components/responses/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /churches/{church}/merge:
    parameters:
      - $ref: "#/components/parameters/ChurchId"
    post:
      tags: [Territories]
      summary: Merge a church into another church of the same mission
      description: |
        org_admin of the organization or super_admin. Repoints `church_id` on Attendees of non-archived events,
        nulls it on Attendees of archived events, deletes the source church and writes an audit log entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_church_id]
              properties:
                target_church_id: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Attendees
  /attendees:
    get:
      tags: [Attendees]
      summary: List / search attendees
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: search
          in: query
          description: Matches against first, middle, and last name (partial, case-insensitive).
          schema: { type: string }
        - name: sort_by
          in: query
          description: Field to sort by. Defaults to 'last_name'.
          schema:
            type: string
            enum: [last_name]
            default: last_name
        - name: sort_order
          in: query
          description: Sort order, either 'asc' or 'desc'. Defaults to 'asc'.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200": { $ref: "#/components/responses/AttendeeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Attendees]
      summary: Create an attendee (one person's registration in one event)
      description: >
        An Attendee is per event: this creates the person's registration in `event_id`, with a
        unique `qr_token`, and queues the ID card. The organization is taken from the event;
        a client-sent `organization_id` is ignored. Runs duplicate detection first (normalized
        first/middle/last name match among the event's attendees). If matches are found and
        `override_duplicate` is not `true`, returns `409` with the candidate list instead of
        creating the record. The response carries the registration view in `registration`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, first_name, last_name, organization_level, union_id]
              properties:
                event_id: { type: integer, description: "The event the person registers in." }
                auto_register:
                  {
                    type: boolean,
                    deprecated: true,
                    description: "Ignored. The created Attendee is always the event registration.",
                  }
                organization_level: { type: string, enum: [union, mission] }
                union_id: { type: integer }
                mission_id: { type: integer, nullable: true }
                church_id: { type: integer, nullable: true }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100 }
                mobile_no: { type: string, maxLength: 20, nullable: true }
                email_address: { type: string, format: email, nullable: true }
                remarks: { type: string, nullable: true }
                override_duplicate: { type: boolean, default: false }
      responses:
        "201": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "409": { $ref: "#/components/responses/DuplicateAttendees" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attendees/check-duplicates:
    get:
      tags: [Attendees]
      summary: Check for potential duplicate attendees by name (does not create anything)
      parameters:
        - name: first_name
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
        - name: middle_name
          in: query
          schema: { type: string, maxLength: 100 }
        - name: last_name
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/AttendeeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attendees/export:
    get:
      tags: [Attendees]
      summary: Export attendees as Excel or PDF
      description: >
        Export one event's attendees. event_id is required. Returns a downloadable file
        in the specified format with styled headers and formatting. Supports optional name search.
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [xlsx, pdf], default: xlsx }
          description: Export file format (defaults to xlsx).
        - name: event_id
          in: query
          required: true
          schema: { type: integer }
          description: Event whose attendees are exported.
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Optional name search filter (matches first, middle, last name).
      responses:
        "200":
          description: File downloaded successfully
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
                description: Excel spreadsheet with styled headers and formatting
            application/pdf:
              schema:
                type: string
                format: binary
                description: PDF document with styled table
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attendees/{attendee}:
    parameters:
      - $ref: "#/components/parameters/AttendeeId"
      - name: event_id
        in: query
        required: false
        schema: { type: integer }
        description: If provided, returns registration stats for the attendee at this event.
    get:
      tags: [Attendees]
      summary: Get an attendee
      description: >
        Returns the attendee's profile. If `event_id` is provided, also includes
        `event_stats` with attendance data for that event (present/absent counts, total sessions, etc.).
        If the attendee is not registered to the event, `event_stats` is null.
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [Attendees]
      summary: Update an attendee
      description: >
        Staff only may change name fields (attendee users get 422 for them). A name change that matches
        another attendee in the organization returns 409 with the candidates; resend with
        `override_duplicate: true` to update anyway. Name, union, mission or level changes regenerate
        the attendee's ID cards. Also accepts `PATCH`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                union_id: { type: integer, nullable: true }
                mission_id: { type: integer, nullable: true }
                church_id: { type: integer, nullable: true }
                organization_level: { type: string, nullable: true }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100 }
                mobile_no: { type: string, maxLength: 20, nullable: true }
                email_address: { type: string, format: email, nullable: true }
                remarks: { type: string, nullable: true }
                override_duplicate: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "409": { $ref: "#/components/responses/DuplicateAttendees" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Attendees]
      summary: Delete an attendee
      description: Org Admin+ only. Returns 409 if other attendee records were merged into this one.
      responses:
        "204": { description: Deleted }
        "409":
          description: Attendee has merged source records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attendees/{attendee}/photo:
    parameters:
      - $ref: "#/components/parameters/AttendeeId"
    post:
      tags: [Attendees]
      summary: Upload an attendee's photo
      description: >
        Creates 4 WebP images (sm/md/lg/original) from the uploaded PNG/JPEG. Org Admin+ only.
        Supports both multipart file uploads and base64 input (with or without data-URI prefix).
        Decoded size must not exceed 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: PNG or JPEG image file
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  description: "Base64-encoded PNG/JPEG, optionally prefixed with data-URI (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Attendees]
      summary: Remove an attendee's photo
      description: Deletes all 4 image sizes. Org Admin+ only.
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }


  # ---------------------------------------------------------------- Events
  /events:
    get:
      tags: [Events]
      summary: List events
      description: >
        Checkers only see events they have access to: every event in their organization by
        default, or a restricted subset if `event_checker_access` rows exist for them (see
        `PUT /users/{user}/event-access`). Archived events are left out unless `archived=1`,
        which returns only archived events.
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: archived
          in: query
          schema: { type: boolean, default: false }
          description: When true, list only archived events.
      responses:
        "200": { $ref: "#/components/responses/EventList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Events]
      summary: Create an event
      description: Org Admin+ only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, start_date, end_date]
              properties:
                organization_id:
                  {
                    type: integer,
                    nullable: true,
                    description: "Required for Super Admins.",
                  }
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                start_date: { type: string, format: date }
                end_date:
                  {
                    type: string,
                    format: date,
                    description: "Must be on/after start_date.",
                  }
                venue: { type: string, maxLength: 255, nullable: true }
                status: { $ref: "#/components/schemas/EventStatus" }
                requires_check_out: { type: boolean, default: false }
                check_in_window_minutes:
                  type: integer
                  default: 30
                  description: How many minutes before a session's start time check-in opens.
      responses:
        "201": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Get an event
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                venue: { type: string, maxLength: 255, nullable: true }
                status: { $ref: "#/components/schemas/EventStatus" }
                requires_check_out: { type: boolean }
                check_in_window_minutes: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/archive:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Archive an event
      description: >
        Super Admin only. Allowed in any status; the status is kept. Sets `archived_at` and
        `archived_by` and is audited as `event.archived`. Events are never deleted.
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/unarchive:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Unarchive an event
      description: >
        Super Admin only. Clears `archived_at` and `archived_by`; the event keeps its status.
        Audited as `event.unarchived`.
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/banner:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Upload an event's banner image
      description: >
        Creates 4 WebP images (sm/md/lg/original) from the uploaded PNG/JPEG. Org Admin+ only.
        Supports both multipart file uploads and base64 input (with or without data-URI prefix).
        Decoded size must not exceed 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [banner]
              properties:
                banner:
                  type: string
                  format: binary
                  description: PNG or JPEG image file
          application/json:
            schema:
              type: object
              required: [banner]
              properties:
                banner:
                  type: string
                  description: "Base64-encoded PNG/JPEG, optionally prefixed with data-URI (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Events]
      summary: Remove an event's banner image
      description: Deletes all 4 image sizes. Org Admin+ only.
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Event Sessions
  /events/{event}/sessions:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Sessions]
      summary: List an event's sessions
      description: Ordered by session_date then start_time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Event Sessions]
      summary: Create a session for an event
      description: Org Admin+ only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, session_date, start_time, end_time]
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                session_date: { type: string, format: date }
                start_time:
                  { type: string, example: "08:00", description: "H:i format." }
                end_time:
                  {
                    type: string,
                    example: "12:00",
                    description: "H:i format, must be after start_time.",
                  }
      responses:
        "201": { $ref: "#/components/responses/EventSessionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/sessions/{session}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Event Sessions]
      summary: Get a session
      responses:
        "200": { $ref: "#/components/responses/EventSessionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Event Sessions]
      summary: Update a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                session_date: { type: string, format: date }
                start_time: { type: string, example: "08:00" }
                end_time: { type: string, example: "12:00" }
      responses:
        "200": { $ref: "#/components/responses/EventSessionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Event Sessions]
      summary: Delete a session
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/sessions/{session}/attendance:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Attendance]
      summary: List attendance records for a session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/sessions/{session}/roster:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Attendance]
      summary: List every registration for a session with its attendance status
      description: >
        Every registration for the event, each annotated with its attendance status for this
        specific session. Defaults to sorted by check-in time ascending; registrations without
        a check-in (absent) sort last. Paginated.
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          description: Items per page.
          schema: { type: integer, default: 15 }
        - name: status
          in: query
          description: Filter by attendance status for this session. Case-insensitive.
          schema:
            type: string
            enum: [all, present, absent]
            default: all
        - name: search
          in: query
          description: Matches against the attendee's first and last name (partial, case-insensitive).
          schema: { type: string }
        - name: sort_by
          in: query
          description: Field to sort by. Defaults to 'session_check_in_at'.
          schema:
            type: string
            enum: [session_check_in_at, attendee.last_name, last_name]
            default: session_check_in_at
        - name: sort_order
          in: query
          description: Sort order, either 'asc' or 'desc'. Defaults to 'asc'.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSessionRoster" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Event Program
  /events/{event}/program:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Event Program]
      summary: Create a program for an event
      description: Org Admin+ only. Fails with 409 if a program already exists for this event.
      responses:
        "201": { $ref: "#/components/responses/EventProgramItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Program already exists for this event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Event Program]
      summary: Get an event's program
      responses:
        "200": { $ref: "#/components/responses/EventProgramItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Event Program]
      summary: Update an event program's title, description and public setting
      description: >
        When `is_public` is true and `public_slug` is empty, a unique slug is generated from the
        title or event name. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_public]
              properties:
                title: { type: string, maxLength: 255, nullable: true }
                description: { type: string, maxLength: 10000, nullable: true }
                is_public: { type: boolean }
                public_slug: { type: string, maxLength: 255, nullable: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      responses:
        "200": { $ref: "#/components/responses/EventProgramItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Event Program]
      summary: Delete an event's program and all its items
      description: Org Admin+ only. Cascades to delete all program items and their associated photos.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/program/items:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Program]
      summary: List all items for a program
      description: Ordered by date then start_time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventProgramItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Event Program]
      summary: Create an item in a program
      description: Org Admin+ only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: integer, description: "Display order (optional, defaults to 0)" }
                date: { type: string, format: date }
                start_time: { type: string, example: "09:00", description: "H:i format" }
                end_time: { type: string, example: "10:00", description: "H:i format, optional" }
                part_title: { type: string, maxLength: 255, nullable: true }
                part_subtitle: { type: string, maxLength: 255, nullable: true }
                part_description: { type: string, nullable: true }
                participant_name: { type: string, maxLength: 255, nullable: true }
                participant_description: { type: string, nullable: true }
                part_remarks: { type: string, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/EventProgramItemDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/program/items/reorder:
    post:
      tags: [Event Program]
      summary: Reorder program items
      description: Org Admin+ only. Updates the order of multiple program items.
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, order]
                    properties:
                      id: { type: integer, description: "Program item ID" }
                      order: { type: integer, description: "New order value", minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventProgramItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/program/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - name: itemId
        in: path
        required: true
        description: Program item ID
        schema: { type: integer }
    get:
      tags: [Event Program]
      summary: Get a program item
      responses:
        "200": { $ref: "#/components/responses/EventProgramItemDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Event Program]
      summary: Update a program item
      description: Org Admin+ only. Supports partial updates; omitted fields are not changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: integer, description: "Display order" }
                date: { type: string, format: date }
                start_time: { type: string, example: "09:00" }
                end_time: { type: string, example: "10:00" }
                part_title: { type: string, maxLength: 255, nullable: true }
                part_subtitle: { type: string, maxLength: 255, nullable: true }
                part_description: { type: string, nullable: true }
                participant_name: { type: string, maxLength: 255, nullable: true }
                participant_description: { type: string, nullable: true }
                part_remarks: { type: string, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/EventProgramItemDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Event Program]
      summary: Delete a program item
      description: Org Admin+ only. Deletes associated photos.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/program/items/{itemId}/photos:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - name: itemId
        in: path
        required: true
        description: Program item ID
        schema: { type: integer }
    post:
      tags: [Event Program]
      summary: Upload a photo to a program item
      description: Org Admin+ only. Accepts base64-encoded data URLs or multipart form uploads. Supports PNG, JPEG, WebP. Generated as sm (small), md (medium), lg (large), and original sizes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  description: "Base64-encoded data URL (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/EventProgramItemDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Event Program]
      summary: Remove a photo from a program item by index
      description: Org Admin+ only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index:
                  type: integer
                  description: "Zero-based index of the photo in the item's photo array"
      responses:
        "200": { $ref: "#/components/responses/EventProgramItemDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Event Registrations
  /events/{event}/registrations:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: List an event's registrations
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: search
          in: query
          description: Matches against the registered attendee's first/last name.
          schema: { type: string }

      responses:
        "200": { $ref: "#/components/responses/EventRegistrationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Event Registrations]
      summary: Register an attendee for the event
      description: >
        One call does either: (a) register a known person — pass `attendee_id` of any of their
        earlier Attendees; a new Attendee for this event is created, prefilled from it (the earlier
        row is untouched; `422` if the person is already in this event); or (b) create a brand-new
        Attendee (scoped to this event's organization) — pass `first_name`/`last_name` (+ optional
        `middle_name`, `union_id`, `mission_id`). New-attendee creation runs the same
        duplicate-detection check among the event's attendees and returns `409` unless
        `override_duplicate` is `true`. A unique, non-guessable `qr_token` is generated for the new
        registration either way. A registration is an Attendee row: its `id` and `attendee_id` are equal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attendee_id:
                  {
                    type: integer,
                    nullable: true,
                    description: "Existing attendee. Mutually exclusive with first_name/last_name.",
                  }
                first_name: { type: string, maxLength: 100, nullable: true }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100, nullable: true }
                union_id: { type: integer, nullable: true }
                mission_id: { type: integer, nullable: true }
                override_duplicate: { type: boolean, default: false }
      responses:
        "201": { $ref: "#/components/responses/EventRegistrationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DuplicateAttendees" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/registrations/qr-export:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: Bulk-export QR codes as a PDF
      description: >
        Org Admin+ only. Generates a print-ready PDF with one QR code per registered attendee.
        Defaults to every registration on the event; pass `registration_ids[]` to export a
        subset. This action is recorded in the audit log.
      parameters:
        - name: registration_ids[]
          in: query
          schema:
            type: array
            items: { type: integer }
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/registrations/id-cards/bulk-download:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: Bulk download identification cards for specified registrations
      description: >
        Download identification cards for specific attendees and merge them into a single PDF.
        Pass `registration_ids[]` as query parameters to specify which registrations to include.
        Only ready (already generated) ID cards are included; missing or pending cards are skipped.
        All PDFs are merged into a single document. This action is recorded in the audit log.
      parameters:
        - name: registration_ids[]
          in: query
          required: true
          schema:
            type: array
            items: { type: integer }
            minItems: 1
          description: Array of registration IDs to download
      responses:
        "200":
          description: Merged PDF file stream containing all requested identification cards
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: No ID cards are ready for download yet. Try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: No registration IDs provided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/id-cards/download-all:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: Download all identification cards for the event
      description: >
        Download identification cards for all attendees registered to the event and merge them
        into a single PDF. Only ready (already generated) ID cards are included; missing or
        pending cards are skipped. This action is recorded in the audit log.
      responses:
        "200":
          description: Merged PDF file stream containing all identification cards for the event
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: No ID cards are ready for download yet. Try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/id-cards/grid-download:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Event Registrations]
      summary: Start a background job to generate a grid PDF of ID card images
      description: >
        Org Admin+ only. Creates a background job that generates a print-ready PDF with ID card
        images arranged in a 2x2 grid on A4 pages (4 cards per page). Each card maintains its
        3in x 4in size with 1rem gaps. Pass `registration_ids[]` to generate a grid for specific
        registrations, or omit it to include only those with ready ID card images. The job runs
        in the background; immediately returns a batch ID with status "pending". Use
        `GET /events/{event}/registrations/id-cards/grid-download/{id}` to poll the status, and
        `GET /events/{event}/registrations/id-cards/grid-download/{id}/file` to download the PDF
        once status is "completed". This action is recorded in the audit log.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_ids:
                  type: array
                  items: { type: integer }
                  description: Optional. Specific registration IDs to include. If omitted, includes all with ready images.
      responses:
        "202":
          description: Background job started. Batch ID returned with status "pending".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdCardGridDownload" }
        "400":
          description: No registrations found with the provided IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/registrations/id-cards/grid-download-all:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Event Registrations]
      summary: Start a background job to generate a grid PDF of all ID card images
      description: >
        Org Admin+ only. Creates a background job that generates a print-ready PDF with ID card
        images for all registrations arranged in a 2x2 grid on A4 pages (4 cards per page).
        Each card maintains its 3in x 4in size with 1rem gaps. Only registrations with ready
        ID card images are included. The job runs in the background; immediately returns a batch
        ID with status "pending". Use `GET /events/{event}/registrations/id-cards/grid-download/{id}`
        to poll the status, and `GET /events/{event}/registrations/id-cards/grid-download/{id}/file`
        to download the PDF once status is "completed". This action is recorded in the audit log.
      responses:
        "202":
          description: Background job started. Batch ID returned with status "pending".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdCardGridDownload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/id-cards/grid-download/{gridDownload}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - name: gridDownload
        in: path
        required: true
        schema: { type: integer }
        description: ID card grid download batch ID
    get:
      tags: [Event Registrations]
      summary: Check the status of a grid PDF download batch
      description: >
        Poll this endpoint to check if the background job has completed. Returns the batch status
        (pending, processing, completed, or failed) and, once completed, includes a `download_url`.
        When status is "failed", the response includes a `failure_reason` explaining why.
      responses:
        "200":
          description: Current batch status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdCardGridDownload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/id-cards/grid-download/{gridDownload}/file:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - name: gridDownload
        in: path
        required: true
        schema: { type: integer }
        description: ID card grid download batch ID
    get:
      tags: [Event Registrations]
      summary: Download the completed grid PDF of ID card images
      description: >
        Returns the generated PDF file when the batch status is "completed". Returns 202 if the
        batch is still processing, or 422 if generation failed with the reason in the response body.
      responses:
        "200":
          description: PDF file stream containing the grid of ID card images
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: Grid PDF is still being generated. Check back shortly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  status: { type: string, enum: [pending, processing] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Grid generation failed (see message for reason)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{event}/registrations/{registration}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    get:
      tags: [Event Registrations]
      summary: Get a registration
      description: Includes the `qr_token` — treat the response as sensitive.
      responses:
        "200": { $ref: "#/components/responses/EventRegistrationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Event Registrations]
      summary: Unregister an attendee from the event
      description: Org Admin+ only. Also deletes any attendance records for this registration (cascade).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/{registration}/id-card:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    get:
      tags: [Event Registrations]
      summary: Download the attendee's identification card PDF
      description: >
        A `GenerateAttendeeIdCardJob` is automatically queued whenever a registration is created
        (`POST /events/{event}/registrations`); this endpoint downloads the result. 3in x 4in
        PDF: QR code centered, attendee name below, on the event's uploaded background
        image if one is set (see `POST /events/{event}/id-card-background`).
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: Still generating — retry shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/{registration}/id-card/regenerate:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    post:
      tags: [Event Registrations]
      summary: Re-queue identification card generation
      description: Org Admin+ only. Useful after changing the event's background image.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Identification card generation has been queued.",
                    }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/id-card-background:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Upload (or replace) the attendee-ID-card background image
      description: Event admin (authorized via EventPolicy). Replaces any existing background.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [background]
              properties:
                background:
                  type: string
                  format: binary
                  description: "image/jpeg, image/png, or image/webp, max 10MB."
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Events]
      summary: Remove the attendee-ID-card background image
      description: Event admin (authorized via EventPolicy). Cards will fall back to a plain background.
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Attendance
  /attendance/scan:
    post:
      tags: [Attendance]
      summary: Record attendance from a QR scan
      description: >
        Resolves the Attendee by `qr_token` scoped to `event_id`, then applies the same
        window/duplicate rules as manual attendance (see below).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, session_id, qr_token]
              properties:
                event_id: { type: integer }
                session_id: { type: integer }
                qr_token: { type: string }
                override:
                  type: boolean
                  default: false
                  description: "Org Admin+ only: bypass the check-in window for a past/future session correction. Ignored (and the early-window error still thrown) for Checkers."
      responses:
        "201": { $ref: "#/components/responses/AttendanceRecordItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "422": { $ref: "#/components/responses/AttendanceValidationFailed" }

  /attendance/manual:
    post:
      tags: [Attendance]
      summary: Record attendance manually (fallback when QR scanning is unavailable)
      description: >
        Pass `attendee_id` (an Attendee of `event_id`). A second check-in for the same session
        returns `422` with `Already Checked In.` (sync-batch reports it as `duplicate`). The old `event_registration_id` is still
        accepted, deprecated, and translated through the Attendee's `legacy_registration_id`;
        it is removed in Release 2. One of the two is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, session_id]
              properties:
                event_id: { type: integer }
                session_id: { type: integer }
                attendee_id: { type: integer, nullable: true }
                event_registration_id:
                  {
                    type: integer,
                    nullable: true,
                    deprecated: true,
                    description: "Use attendee_id. Removed in Release 2.",
                  }
                override:
                  type: boolean
                  default: false
                  description: "Org Admin+ only: bypass the check-in window."
      responses:
        "201": { $ref: "#/components/responses/AttendanceRecordItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "422": { $ref: "#/components/responses/AttendanceValidationFailed" }

  /attendance/{attendanceRecord}/check-out:
    parameters:
      - $ref: "#/components/parameters/AttendanceRecordId"
    post:
      tags: [Attendance]
      summary: Record a check-out
      description: Only allowed when the event's `requires_check_out` flag is true.
      responses:
        "200": { $ref: "#/components/responses/AttendanceRecordItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Event does not require check-out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ---------------------------------------------------------------- Audit Logs
  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries
      description: >
        Super Admin sees every entry across all organizations; Org Admin sees only their own
        organization's entries; Checkers are forbidden. Append-only — there is no write endpoint,
        entries are created internally whenever a tracked action happens (see `action` values
        below).
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: action
          in: query
          description: >
            Exact match. Known values: `attendee.created`, `attendee.updated`, `attendee.deleted`,
            `event_registration.created`, `event_registration.deleted`,
            `event_registration.qr_pdf_exported`, `attendance.checked_in`,
            `attendance.checked_in_override`, `attendance.checked_out`, `user.created`,
            `user.updated`, `user.deleted`, `organization.created`, `organization.updated`,
            `organization.deleted`.
          schema: { type: string }
        - name: auditable_type
          in: query
          description: 'Fully-qualified model class, e.g. `App\Models\Attendee`.'
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: integer }
        - name: from
          in: query
          description: Inclusive lower bound on created_at.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive upper bound on created_at.
          schema: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/AuditLogList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- System Logs
  /system-logs/dates:
    get:
      tags: [System Logs]
      summary: List available log dates
      description: >
        Returns a list of available daily Laravel log files with metadata (file size, modification time).
        Super Admin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date of the log file (YYYY-MM-DD)
                        size:
                          type: integer
                          description: File size in bytes
                        modified_at:
                          type: integer
                          description: Unix timestamp of last modification
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system-logs:
    get:
      tags: [System Logs]
      summary: List paginated log entries for a date
      description: >
        Retrieve Laravel log entries for a specific date with optional filtering by log level
        and keyword search. Multi-line entries (including stack traces) are included in full.
        Entries are ordered newest-first. Super Admin only.
      parameters:
        - name: date
          in: query
          required: true
          description: Date to retrieve logs for (YYYY-MM-DD format)
          schema: { type: string, format: date }
        - name: level
          in: query
          description: >-
            Filter by log level (case-insensitive). One of: debug, info, notice, warning, error,
            critical, alert, emergency.
          schema:
            type: string
            enum: [debug, info, notice, warning, error, critical, alert, emergency]
        - name: search
          in: query
          description: Keyword search within log entries (case-insensitive, max 255 chars)
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/Page"
        - name: per_page
          in: query
          description: Items per page (1-100, default 15)
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: OK — paginated log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Validation error (invalid date format, level, or per_page)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ---------------------------------------------------------------- Reports
  /events/{event}/reports/attendance-summary:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Get attendance summary for an event
      description: >
        Aggregated counts per session and overall totals: registered, checked-in, checked-out,
        and no-show. Org Admin+ only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EventAttendanceSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/reports/attendance-summary/export:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Export event attendance report
      description: >
        Export attendance data in Excel (xlsx) or PDF format. Pass `?format=pdf` or
        `?format=xlsx` (default: xlsx). Org Admin+ only.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, pdf]
            default: xlsx
      responses:
        "200":
          description: File stream (Excel or PDF depending on format parameter)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organization}/reports/dashboard:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      summary: Get organization dashboard with metrics and trends
      description: >
        **Access Policy:** Organization Admin or Super Admin only. Checkers are forbidden (403).
        Org Admins can only access their own organization's dashboard; cross-organization attempts return 404.
        Super Admin can access any organization's dashboard.

        Comprehensive organization dashboard: event counts by status, attendee and registration totals,
        latest event quick stats (registered, checked-in, checked-out, no-show, rates),
        next upcoming event spotlight, attendance rate trend (last 5 completed events),
        and registration breakdowns by union and mission.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organization}/reports/attendance-overview:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      summary: Get organization-level attendance overview
      description: >
        Breakdown of attendance across all events by union and mission. Org Admin+ only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationAttendanceOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Get global dashboard with cross-organization metrics
      description: >
        **Access Policy:** Super Admin only (403 Forbidden for all other roles: Org Admin, Checker, Attendee).

        Returns cross-organization totals (organizations, events by status, attendees, registrations)
        and a per-organization breakdown table. Used for high-level monitoring across all organizations.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/GlobalDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Attendance (continued)
  /attendance/sync-batch:
    post:
      tags: [Attendance]
      summary: Process a batch of attendance scans with per-item error handling
      description: >
        Submit multiple scans (QR or manual) in a single request. Each scan is processed
        independently; partial failures do not affect other scans in the batch. Returns a
        per-item result array with status (created/duplicate/error/event_archived) and message.
        `scanned_at` (optional, ISO 8601 format) allows offline clients to preserve the
        original scan time; if omitted, defaults to the current server time.
        A scan for an archived event gets status `event_archived` with message
        `This event is archived.`, even when `scanned_at` is before the archive time.
        A Draft Attendee (never fully registered) gets status `error` with message `Registration incomplete.`;
        a once-registered Attendee that is now incomplete is admitted and the result carries `incomplete: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    { $ref: "#/components/schemas/AttendanceScanBatchItem" }
      responses:
        "200":
          description: Batch processed (some or all scans may have failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      { $ref: "#/components/schemas/AttendanceScanBatchResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Attendee self-service
  /attendee/registrations:
    get:
      tags: [Auth]
      summary: List the authenticated attendee's event registrations
      description: >
        Attendee users and users with an attendee profile only. Newest first, with each
        registration's event and attendance records.
      responses:
        "200": { $ref: "#/components/responses/EventRegistrationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attendee/events/{event}/attendance:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Auth]
      summary: Get the authenticated attendee's attendance for an event
      description: >
        Per-session attendance for the caller's registration in this event, sessions ordered by
        date and start time. 404 if the caller is not registered.
      responses:
        "200":
          description: Session-by-session attendance
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attendee/events/{event}/program:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Auth]
      summary: Get an event's program for a registered attendee
      description: Days, sections and items with speakers. 404 if the caller is not registered or the event has no program.
      responses:
        "200": { $ref: "#/components/responses/EventProgramItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attendee/events/{eventId}/speakers:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Auth]
      summary: List an event's speakers for a registered attendee
      description: 404 if the caller is not registered for the event.
      responses:
        "200": { $ref: "#/components/responses/SpeakerList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Attendee duplicates
  /attendees/duplicates:
    get:
      tags: [Attendees]
      summary: List groups of possible duplicate attendees
      description: >
        Groups attendees of one organization by normalized name, skipping groups whose pairs were
        all dismissed. Super Admins may filter by `organization_id`. Paginated in memory.
      parameters:
        - $ref: "#/components/parameters/Page"
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: organization_id, in: query, schema: { type: integer }, description: Super Admin only. }
      responses:
        "200":
          description: Duplicate groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        organization_id: { type: integer }
                        organization_name: { type: string, nullable: true }
                        normalized_name: { type: string }
                        attendee_count: { type: integer }
                        has_account_conflict:
                          type: boolean
                          description: True when more than one attendee in the group is linked to a different user.
                        attendees:
                          type: array
                          items: { $ref: "#/components/schemas/Attendee" }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /attendees/duplicates/dismiss:
    post:
      tags: [Attendees]
      summary: Mark attendees as not duplicates of each other
      description: Records a dismissal for every pair in `attendee_ids`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendee_ids]
              properties:
                attendee_ids:
                  type: array
                  minItems: 2
                  items: { type: integer }
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attendees/duplicates/merge:
    post:
      tags: [Attendees]
      summary: Merge duplicate attendees into a primary attendee
      description: >
        Moves registrations and attendance from each duplicate onto the primary attendee and marks
        the duplicates as merged. 409 when the merge conflicts (for example, two linked accounts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [primary_attendee_id, duplicate_attendee_ids]
              properties:
                primary_attendee_id: { type: integer }
                duplicate_attendee_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "409":
          description: Merge not possible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Speakers
  /events/{event}/speakers:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Speakers]
      summary: List an event's speakers
      description: Requires permission to update the event.
      responses:
        "200": { $ref: "#/components/responses/SpeakerList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Speakers]
      summary: Create a speaker
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, designation, organization, bio, photo]
              properties:
                name: { type: string, maxLength: 255 }
                designation: { type: string, maxLength: 255 }
                organization: { type: string, maxLength: 255 }
                bio: { type: string, maxLength: 2000 }
                photo: { type: string, format: binary, description: PNG image }
      responses:
        "201": { $ref: "#/components/responses/SpeakerItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/speakers/{speaker}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SpeakerId"
    put:
      tags: [Speakers]
      summary: Update a speaker
      description: Also accepts `PATCH`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, designation, organization, bio]
              properties:
                name: { type: string, maxLength: 255 }
                designation: { type: string, maxLength: 255 }
                organization: { type: string, maxLength: 255 }
                bio: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/SpeakerItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Speakers]
      summary: Delete a speaker
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/speakers/{speaker}/photo:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SpeakerId"
    post:
      tags: [Speakers]
      summary: Replace a speaker's photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: PNG image }
      responses:
        "200": { $ref: "#/components/responses/SpeakerItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/speaker-settings:
    parameters:
      - $ref: "#/components/parameters/EventId"
    put:
      tags: [Speakers]
      summary: Show or hide speakers on public pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [speakers_public]
              properties:
                speakers_public: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Event program builder
  /events/{event}/program/builder/{kind}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ProgramNodeKind"
    post:
      tags: [Event Program]
      summary: Create a program day, section or part
      description: >
        `days` need a unique `date`; `sections` and `parts` need `parent_id` (the day or section).
        Returns the created node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramNodeInput" }
      responses:
        "201": { $ref: "#/components/responses/ProgramNode" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/program/builder/{kind}/order:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ProgramNodeKind"
    put:
      tags: [Event Program]
      summary: Reorder program days, sections or parts
      description: "`ids` in the new order; `parent_id` names the day or section for sections and parts."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                parent_id: { type: integer, nullable: true }
                ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        "204": { description: Reordered }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/program/builder/{kind}/{node}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ProgramNodeKind"
      - $ref: "#/components/parameters/ProgramNodeId"
    put:
      tags: [Event Program]
      summary: Update a program day, section or part
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramNodeInput" }
      responses:
        "200": { $ref: "#/components/responses/ProgramNode" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Event Program]
      summary: Delete a program day, section or part and its children
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/program/builder/{kind}/{node}/duplicate:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/ProgramNodeKind"
      - $ref: "#/components/parameters/ProgramNodeId"
    post:
      tags: [Event Program]
      summary: Duplicate a program day, section or part with its children
      responses:
        "201": { $ref: "#/components/responses/ProgramNode" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Event registration ID card image
  /events/{event}/registrations/{registration}/id-card-image:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    get:
      tags: [Event Registrations]
      summary: Get the first ID card image of a registration
      description: Returns 202 while the ID card is still being generated.
      responses:
        "200":
          description: Image file
          content:
            image/*:
              schema: { type: string, format: binary }
        "202":
          description: ID card still being generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /download/id-card-template:
    get:
      tags: [Event Registrations]
      summary: Download the sample ID card background template
      responses:
        "200":
          description: JPEG file
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- More reports
  /events/{event}/sessions/{session}/quick-stats:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Reports]
      summary: Get present and absent counts for one session
      description: Requires permission to view the session roster.
      responses:
        "200":
          description: Session counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id: { type: integer }
                  session_id: { type: integer }
                  total_registered: { type: integer }
                  attendance:
                    type: object
                    properties:
                      present: { type: integer }
                      absent: { type: integer }
                      attendance_rate: { type: number, description: "Percentage 0-100, one decimal" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/reports/dashboard:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Get the event dashboard report
      description: Staff with access to the event's data. Audited.
      responses:
        "200":
          description: Event dashboard data
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/reports/attendee-summary:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Get per-attendee attendance totals for an event
      description: Staff with access to the event's data. Audited.
      responses:
        "200":
          description: One row per registered attendee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/reports/attendee-summary/export:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Export per-attendee attendance totals as xlsx
      description: Throttled to 6 requests per minute. Audited.
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: Too many requests }

  # ---------------------------------------------------------------- Search
  /search:
    get:
      tags: [Search]
      summary: Search across the caller's accessible records
      description: >
        Results are grouped by category. Pass `category` to page through one group. Scoped to
        `event_id` unless `all_events` is true. Throttled to 60 requests per minute.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 150 } }
        - { name: event_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: all_events, in: query, schema: { type: boolean } }
        - name: category
          in: query
          schema:
            type: string
            enum: [organizations, users, attendees, unions, missions, churches, events, sessions, registrations, attendance, program, speakers]
        - $ref: "#/components/parameters/Page"
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses:
        "200":
          description: Grouped results
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        total: { type: integer }
                        page: { type: integer }
                        has_more: { type: boolean }
                        items:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                            properties:
                              type: { type: string }
                              id: { type: integer }
                              title: { type: string }
                              subtitle: { type: string, nullable: true }
                              context: { type: string, nullable: true }
                              event_id: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { description: Too many requests }

  # ---------------------------------------------------------------- Profile photos
  /profile-photos/{kind}/{id}/{size}:
    get:
      tags: [Users]
      summary: Get a user or attendee profile photo
      description: >
        Signed URL only (the API returns these URLs in `photo_urls`); no bearer token needed.
        Responses are `private, no-store`.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [users, attendees] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: size, in: path, required: true, schema: { type: string, enum: [sm, md, lg, original] } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: WebP image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "403": { description: Invalid or expired signature }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Public (no auth)
  /public/unions:
    get:
      tags: [Public]
      summary: List unions for public forms
      security: []
      parameters:
        - &publicEventParam { name: event, in: query, description: "Event invite token. Limits the list to the event's organization; 404 when unknown.", schema: { type: string } }
      responses:
        "200":
          description: Unions with id, name, code and organization_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        code: { type: string, nullable: true }
                        organization_id: { type: integer }

  /public/missions:
    get:
      tags: [Public]
      summary: List missions for public forms
      security: []
      parameters:
        - { name: union_id, in: query, schema: { type: integer } }
        - *publicEventParam
      responses:
        "200":
          description: Missions with id, name and code
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        code: { type: string, nullable: true }

  /public/churches:
    get:
      tags: [Public]
      summary: List churches of a mission for public forms
      description: Verified and unverified churches alike. Never exposes the verification flag.
      security: []
      parameters:
        - { name: mission_id, in: query, required: true, schema: { type: integer } }
        - { name: event, in: query, required: true, description: "Event invite token. Limits the list to the event's organization; 404 when unknown.", schema: { type: string } }
      responses:
        "200":
          description: Churches with id, name, address and mission_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        address: { type: string, nullable: true }
                        mission_id: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /public/programs/{publicSlug}:
    get:
      tags: [Public]
      summary: Get a public event program by slug
      description: 404 unless the program is public and its event is published.
      security: []
      parameters:
        - { name: publicSlug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Program with event, days, sections, items and speakers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/event/{eventInviteToken}:
    parameters:
      - $ref: "#/components/parameters/EventInviteToken"
    get:
      tags: [Public]
      summary: Get event landing page data by invite token
      description: 404 unless the event is published.
      security: []
      responses:
        "200":
          description: Event with organization, sessions, program and public speakers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/event/{eventInviteToken}/register:
    parameters:
      - $ref: "#/components/parameters/EventInviteToken"
    post:
      tags: [Public]
      summary: Register the signed-in user for the event
      description: >
        Creates the user's attendee record if needed, then the registration, and queues the ID
        card. 201 for a new registration, 200 if already registered. 404 unless the event is published.
      responses:
        "200": { $ref: "#/components/responses/EventRegistrationItem" }
        "201": { $ref: "#/components/responses/EventRegistrationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrArchived" }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/attendee-claims/status:
    post:
      tags: [Public]
      summary: Check whether an ID card QR code is already claimed
      description: Throttled to 10 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Claim status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unclaimed, claimed, unavailable]
                    description: "`unavailable` when the Attendee has an email and cannot be claimed by QR."
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { description: Too many requests }

  /public/attendee-claims/verify:
    post:
      tags: [Public]
      summary: Verify identity for an unclaimed ID card QR code
      description: >
        Matches name, union and mission against the Attendee behind `qr_token` and returns a
        short-lived claim token. Refused (422 on `qr_token`) when the Attendee has a login or an email. Throttled to 10 requests per minute plus a per-registration attempt limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, first_name, last_name, union_id, mission_id]
              properties:
                qr_token: { type: string, maxLength: 512 }
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                union_id: { type: integer }
                mission_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim_token: { type: string }
                  requires_email:
                    type: boolean
                    description: Always true; the Attendee has no email, so one must be verified before completing.
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { description: Too many requests }

  /public/attendee-claims/email-code:
    post:
      tags: [Public]
      summary: Send an email verification code during a QR claim
      description: Only for attendees without an email. Throttled to 6 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token, email]
              properties:
                claim_token: { type: string, minLength: 64, maxLength: 64 }
                email: { type: string, format: email, maxLength: 255 }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { description: Too many requests }

  /public/attendee-claims/verify-email-code:
    post:
      tags: [Public]
      summary: Verify the emailed code during a QR claim
      description: Throttled to 6 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token, code]
              properties:
                claim_token: { type: string, minLength: 64, maxLength: 64 }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { description: Too many requests }

  /public/attendee-claims/complete:
    post:
      tags: [Public]
      summary: Complete a QR claim by creating the account
      description: >
        Creates a user with the given password and the email verified during the claim, links it to the
        scanned Attendee (the email is saved on it), then links every other Attendee without a login that
        has that email. Returns an API token. Throttled to 6 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token, password, password_confirmation]
              properties:
                claim_token: { type: string, minLength: 64, maxLength: 64 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { description: Too many requests }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token, obtained from `POST /auth/login`.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    OrganizationId:
      {
        name: organization,
        in: path,
        required: true,
        schema: { type: integer },
      }
    UserId: { name: user, in: path, required: true, schema: { type: integer } }
    UnionId:
      { name: union, in: path, required: true, schema: { type: integer } }
    MissionId:
      { name: mission, in: path, required: true, schema: { type: integer } }
    ChurchId:
      { name: church, in: path, required: true, schema: { type: integer } }
    AttendeeId:
      { name: attendee, in: path, required: true, schema: { type: integer } }
    EventId:
      { name: event, in: path, required: true, schema: { type: integer } }
    SessionId:
      { name: session, in: path, required: true, schema: { type: integer } }
    RegistrationId:
      {
        name: registration,
        in: path,
        required: true,
        schema: { type: integer },
      }
    SpeakerId:
      { name: speaker, in: path, required: true, schema: { type: integer } }
    ProgramNodeKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [days, sections, parts] }
    ProgramNodeId:
      { name: node, in: path, required: true, schema: { type: integer } }
    EventInviteToken:
      { name: eventInviteToken, in: path, required: true, schema: { type: string } }
    AttendanceRecordId:
      {
        name: attendanceRecord,
        in: path,
        required: true,
        schema: { type: integer },
      }

  schemas:
    UserRole:
      type: string
      enum: [super_admin, org_admin, checker]

    EventStatus:
      type: string
      enum: [draft, published, completed, cancelled]

    AttendanceMethod:
      type: string
      enum: [qr, manual]

    AttendanceMethodValue:
      type: string
      enum: [qr, manual]

    AttendanceSummary:
      type: object
      description: Attendance count summary for past events.
      properties:
        sessions_total: { type: integer, description: "Total sessions in the event" }
        sessions_attended: { type: integer, description: "Number of sessions attended (checked in)" }

    AttendeeProfileData:
      type: object
      nullable: true
      description: The Attendee master record linked to this user, if it exists.
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer, nullable: true }
        mission_id: { type: integer, nullable: true }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        full_name: { type: string }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        union:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        mission:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AttendeeAccountData:
      type: object
      description: The authenticated User record.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [attendee] }
        organization_id: { type: integer }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpcomingEventData:
      type: object
      description: Event registration data for an upcoming event.
      properties:
        registration_id: { type: integer, description: "EventRegistration id" }
        event: { $ref: "#/components/schemas/Event" }
        qr_token: { type: string, description: "Opaque token for QR code check-in" }
        id_card_ready: { type: boolean, description: "Whether the ID card has been generated" }
        id_card_url:
          type: string
          format: uri
          nullable: true
          description: "URL to download the ID card PDF, or null if not ready"
        next_session:
          type: object
          nullable: true
          description: "The earliest upcoming session, or null if all sessions have passed"
          properties:
            id: { type: integer }
            event_id: { type: integer }
            name: { type: string }
            description: { type: string, nullable: true }
            session_date: { type: string, format: date }
            start_time: { type: string, example: "08:00:00" }
            end_time: { type: string, example: "12:00:00" }
            check_in_opens_at: { type: string, format: date-time }
        days_until_start:
          type: integer
          nullable: true
          description: "Number of days until event start (in next_event spotlight only); null for regular upcoming_events list items"

    PastEventData:
      type: object
      description: Event registration data for a past event.
      properties:
        registration_id: { type: integer, description: "EventRegistration id" }
        event: { $ref: "#/components/schemas/Event" }
        attendance_summary: { $ref: "#/components/schemas/AttendanceSummary" }

    EventRegistrationStats:
      type: object
      description: Quick stats for an attendee's registration to a specific event.
      properties:
        registered: { type: boolean, description: "True if attendee is registered to the event" }
        registered_at: { type: string, format: date-time, nullable: true, description: "When the attendee registered (null if not registered)" }
        present_count: { type: integer, description: "Number of sessions attendee checked in to" }
        absent_count: { type: integer, description: "Number of past sessions attendee did not check in to (future sessions excluded)" }
        total_sessions: { type: integer, description: "Total sessions in the event" }
        registration_count: { type: integer, description: "Total events this attendee is registered to (across all events)" }

    AttendeeStatsData:
      type: object
      description: Aggregate statistics for the attendee.
      properties:
        total_events_registered: { type: integer, description: "Total events the attendee is registered for" }
        total_upcoming_events: { type: integer, description: "Events with end_date >= today" }
        total_past_events: { type: integer, description: "Events with end_date < today" }
        total_sessions_attended: { type: integer, description: "Total sessions checked in to" }
        total_sessions_available: { type: integer, description: "Total sessions across past events" }
        attendance_rate: { type: number, format: float, description: "Percentage (0-100) of available sessions attended, rounded to 1 decimal" }

    AttendeeDashboard:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/AttendeeProfileData" }
        account: { $ref: "#/components/schemas/AttendeeAccountData" }
        upcoming_events:
          type: array
          items: { $ref: "#/components/schemas/UpcomingEventData" }
          description: "Sorted ascending by event start_date (soonest first)"
        past_events:
          type: array
          items: { $ref: "#/components/schemas/PastEventData" }
          description: "Sorted descending by event end_date (most recent first)"
        next_event:
          allOf: [{ $ref: "#/components/schemas/UpcomingEventData" }]
          type: object
          nullable: true
          description: "Spotlight: the soonest upcoming event, with days_until_start included. Null if no upcoming events."
        latest_event:
          allOf: [{ $ref: "#/components/schemas/PastEventData" }]
          type: object
          nullable: true
          description: "Spotlight: the most recent past event with attendance summary. Null if no past events."
        stats: { $ref: "#/components/schemas/AttendeeStatsData" }

    OrganizationDashboard:
      type: object
      description: Organization dashboard with metrics, trends, and breakdowns.
      properties:
        organization_id: { type: integer }
        organization_name: { type: string }
        events:
          type: object
          properties:
            total: { type: integer }
            draft: { type: integer }
            published: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            upcoming: { type: integer, description: "Events with start_date >= today and status != cancelled" }
            ongoing: { type: integer, description: "Events with start_date <= today and end_date >= today and status != cancelled" }
        attendees:
          type: object
          properties:
            total: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        latest_event:
          type: object
          nullable: true
          description: "Most recent completed event, or null if none exist. Falls back to most recent ended event by date."
          properties:
            id: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            venue: { type: string, nullable: true }
            stats:
              type: object
              properties:
                registered: { type: integer }
                checked_in: { type: integer }
                checked_out: { type: integer }
                no_show: { type: integer }
                check_in_rate: { type: number, format: float, description: "Percentage 0-100" }
                check_out_rate: { type: number, format: float, description: "Percentage 0-100" }
        next_upcoming_event:
          type: object
          nullable: true
          description: "Earliest event with start_date >= today and status in (draft, published), or null if none exist."
          properties:
            id: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            venue: { type: string, nullable: true }
            days_until_start: { type: integer }
            registrations_count: { type: integer }
        attendance_rate_trend:
          type: array
          description: "Last 5 completed events, ordered by end_date descending (most recent first)."
          items:
            type: object
            properties:
              event_id: { type: integer }
              event_name: { type: string }
              end_date: { type: string, format: date }
              registered: { type: integer }
              checked_in: { type: integer }
              rate: { type: number, format: float, description: "Check-in percentage 0-100" }
        breakdown_by_union:
          type: object
          description: "Registration counts keyed by union name (or 'No Union')"
          additionalProperties:
            type: integer
        breakdown_by_mission:
          type: object
          description: "Registration counts keyed by mission name (or 'No Mission')"
          additionalProperties:
            type: integer

    GlobalDashboard:
      type: object
      description: Global dashboard for SuperAdmin (cross-organization view).
      properties:
        organizations:
          type: object
          properties:
            total: { type: integer, description: "Total organizations across the system" }
            active: { type: integer, description: "Organizations with is_active = true" }
        events:
          type: object
          description: "Event counts across all organizations by status"
          properties:
            total: { type: integer }
            draft: { type: integer }
            published: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            upcoming: { type: integer }
            ongoing: { type: integer }
        attendees:
          type: object
          properties:
            total: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        by_organization:
          type: array
          description: "Per-organization breakdown table"
          items:
            type: object
            properties:
              organization_id: { type: integer }
              organization_name: { type: string }
              total_events: { type: integer }
              total_attendees: { type: integer }
              total_registrations: { type: integer }

    HomeDashboardUser:
      type: object
      description: Common authenticated-user envelope shared by all `/dashboard` role variants.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        organization_id: { type: integer, nullable: true, description: "Always null for super_admin." }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }

    HomeDashboardEventCounts:
      type: object
      description: Event counts by status, scoped to whatever set of events the dashboard variant covers.
      properties:
        total: { type: integer }
        draft: { type: integer }
        published: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        upcoming: { type: integer, description: "start_date >= today and status != cancelled" }
        ongoing: { type: integer, description: "start_date <= today and end_date >= today and status != cancelled" }

    HomeDashboardUpcomingEvent:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        venue: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EventStatus" }
        registrations_count: { type: integer }
        days_until_start: { type: integer }

    HomeDashboardTodaySession:
      type: object
      description: A session scheduled for today, with live check-in/check-out progress.
      properties:
        id: { type: integer }
        event_id: { type: integer }
        event_name: { type: string }
        name: { type: string }
        start_time: { type: string, example: "08:00:00" }
        end_time: { type: string, example: "12:00:00" }
        check_in_opens_at: { type: string, format: date-time }
        registered:
          type: integer
          description: "Total registrations for the parent event (shared across all of its sessions)."
        checked_in: { type: integer }
        checked_out: { type: integer }

    HomeDashboardAttendanceTrendItem:
      type: object
      properties:
        event_id: { type: integer }
        event_name: { type: string }
        end_date: { type: string, format: date }
        registered: { type: integer }
        checked_in: { type: integer }
        rate: { type: number, format: float, description: "Check-in percentage 0-100" }

    HomeDashboardRecentActivityItem:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, example: "attendee.created" }
        user: { type: string, nullable: true, description: "Name of the actor, or null for system actions." }
        auditable_type: { type: string, nullable: true, description: "Class basename, e.g. \"Attendee\"." }
        created_at: { type: string, format: date-time }

    SuperAdminHomeDashboard:
      type: object
      description: "`/dashboard` response for role = super_admin: cross-organization overview."
      properties:
        role: { type: string, enum: [super_admin] }
        user: { $ref: "#/components/schemas/HomeDashboardUser" }
        generated_at: { type: string, format: date-time }
        organizations:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer, description: "is_active = true" }
            inactive: { type: integer, description: "is_active = false" }
        events: { $ref: "#/components/schemas/HomeDashboardEventCounts" }
        attendees:
          type: object
          properties:
            total: { type: integer }
        users:
          type: object
          description: "Staff user counts across all organizations, by role."
          properties:
            total: { type: integer }
            super_admins: { type: integer }
            org_admins: { type: integer }
            checkers: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        top_organizations:
          type: array
          description: "Top 5 organizations by total registrations, descending."
          items:
            type: object
            properties:
              organization_id: { type: integer }
              organization_name: { type: string }
              total_events: { type: integer }
              total_attendees: { type: integer }
              total_registrations: { type: integer }
        next_upcoming_event:
          allOf: [{ $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }]
          type: object
          nullable: true
          description: "Spotlight: soonest of upcoming_events, or null if none exist."
        upcoming_events:
          type: array
          description: "Next 5 upcoming events platform-wide, ordered by start_date ascending."
          items: { $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }
        attendance_rate_trend:
          type: array
          description: "Last 5 completed events platform-wide, ordered by end_date descending."
          items: { $ref: "#/components/schemas/HomeDashboardAttendanceTrendItem" }
        recent_activity:
          type: array
          description: "Latest 10 audit log entries system-wide, most recent first."
          items: { $ref: "#/components/schemas/HomeDashboardRecentActivityItem" }

    OrgAdminHomeDashboard:
      type: object
      description: "`/dashboard` response for role = org_admin: overview scoped to the caller's organization."
      properties:
        role: { type: string, enum: [org_admin] }
        user: { $ref: "#/components/schemas/HomeDashboardUser" }
        generated_at: { type: string, format: date-time }
        organization:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            code: { type: string }
            logo_url: { type: string, format: uri, nullable: true }
        events: { $ref: "#/components/schemas/HomeDashboardEventCounts" }
        attendees:
          type: object
          properties:
            total: { type: integer }
        users:
          type: object
          description: "Staff user counts within the organization, by role."
          properties:
            total: { type: integer }
            org_admins: { type: integer }
            checkers: { type: integer }
        unions:
          type: object
          properties:
            total: { type: integer }
        missions:
          type: object
          properties:
            total: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        next_upcoming_event:
          allOf: [{ $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }]
          type: object
          nullable: true
          description: "Spotlight: soonest of upcoming_events, or null if none exist."
        upcoming_events:
          type: array
          description: "Next 5 upcoming events for the organization, ordered by start_date ascending."
          items: { $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }
        today_sessions:
          type: array
          description: "Sessions scheduled for today across the organization's events, ordered by start_time ascending."
          items: { $ref: "#/components/schemas/HomeDashboardTodaySession" }
        attendance_rate_trend:
          type: array
          description: "Last 5 completed events for the organization, ordered by end_date descending."
          items: { $ref: "#/components/schemas/HomeDashboardAttendanceTrendItem" }
        breakdown_by_union:
          type: object
          description: "Registration counts keyed by union name (or 'No Union')."
          additionalProperties: { type: integer }
        breakdown_by_mission:
          type: object
          description: "Registration counts keyed by mission name (or 'No Mission')."
          additionalProperties: { type: integer }
        recent_activity:
          type: array
          description: "Latest 10 audit log entries for the organization, most recent first."
          items: { $ref: "#/components/schemas/HomeDashboardRecentActivityItem" }

    CheckerHomeDashboard:
      type: object
      description: "`/dashboard` response for role = checker: operational, scanning-focused overview."
      properties:
        role: { type: string, enum: [checker] }
        user: { $ref: "#/components/schemas/HomeDashboardUser" }
        generated_at: { type: string, format: date-time }
        access_restricted:
          type: boolean
          description: >
            Whether this checker has explicit event_checker_access rows (true = restricted to
            accessible_events_count events only; false = full organization access, the default).
        accessible_events_count: { type: integer }
        upcoming_events:
          type: array
          description: "Next 5 upcoming accessible events, ordered by start_date ascending."
          items: { $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }
        today_sessions:
          type: array
          description: "Sessions scheduled for today across accessible events, ordered by start_time ascending."
          items: { $ref: "#/components/schemas/HomeDashboardTodaySession" }
        my_scan_stats:
          type: object
          description: "Attendance records personally recorded (checked in or manually marked) by this checker."
          properties:
            today: { type: integer }
            total: { type: integer, description: "All-time count." }
        recent_scans:
          type: array
          description: "Last 10 attendance records recorded by this checker, most recent first."
          items:
            type: object
            properties:
              id: { type: integer }
              attendee_name: { type: string }
              event_id: { type: integer }
              event_name: { type: string }
              session_name: { type: string, nullable: true }
              method: { $ref: "#/components/schemas/AttendanceMethod" }
              check_in_at: { type: string, format: date-time, nullable: true }
              check_out_at: { type: string, format: date-time, nullable: true }

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        logo_path: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        name:
          {
            type: string,
            description: "Derived: first + middle + last, trimmed.",
          }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true, description: "Null if email is not yet verified." }
        email_verified: { type: boolean, description: "True if email_verified_at is set." }
        role: { $ref: "#/components/schemas/UserRole" }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        organization_id:
          {
            type: integer,
            nullable: true,
            description: "Always null for super_admin.",
          }
        organization:
          allOf: [{ $ref: "#/components/schemas/Organization" }]
          description: Only present when explicitly eager-loaded server-side.
        invited_at: { type: string, format: date-time, nullable: true, description: "Timestamp when invitation was sent (null if user was created directly, not via invite)." }
        invite_status: { type: string, enum: [pending, accepted, null], nullable: true, description: "'pending' if invitation not yet accepted, 'accepted' if accepted, null if created directly." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Union:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        name: { type: string }
        code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Mission:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer }
        name: { type: string }
        code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Church:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer }
        mission_id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true, description: "Admin resources only (org_admin, super_admin)." }
        verified_by: { type: integer, nullable: true, description: "Admin resources only." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImageUrls:
      type: object
      description: URLs for 4 WebP image sizes. All are null if photo/banner was never uploaded.
      properties:
        sm: { type: string, format: uri, nullable: true, description: "480px width" }
        md: { type: string, format: uri, nullable: true, description: "1024px width" }
        lg: { type: string, format: uri, nullable: true, description: "1920px width" }
        original: { type: string, format: uri, nullable: true, description: "Up to 3000px width, maintains aspect ratio" }

    Attendee:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer, description: "Follows the event's organization; never client input." }
        event_id: { type: integer, nullable: true, description: "The event this Attendee is registered in." }
        union_id: { type: integer, nullable: true }
        mission_id: { type: integer, nullable: true }
        church_id: { type: integer, nullable: true }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        full_name:
          {
            type: string,
            description: "Derived: first + middle + last, trimmed.",
          }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        union: { $ref: "#/components/schemas/Union" }
        mission: { $ref: "#/components/schemas/Mission" }
        church: { $ref: "#/components/schemas/Church" }
        mobile_no: { type: string, maxLength: 20, nullable: true }
        email_address: { type: string, format: email, nullable: true }
        remarks: { type: string, nullable: true }
        registration_status: { type: string, nullable: true, enum: [registered, incomplete, draft], description: "Null when the Attendee has no event. `draft` never fully registered (no QR token, no ID card, scans refused); `incomplete` was registered and is now incomplete (QR kept, scans admitted with an `incomplete` note)." }
        registration_completed_at: { type: string, format: date-time, nullable: true, description: "Current state; cleared when the Attendee becomes incomplete." }
        first_registered_at: { type: string, format: date-time, nullable: true, description: "Set once on first full registration, never cleared." }
        registration_confirmed_at: { type: string, format: date-time, nullable: true, description: "The Finish confirmation; cleared when the Attendee becomes incomplete." }
        completeness:
          type: object
          description: "Per-step state in wizard order (event Attendees only); open the first step with `complete: false`."
          additionalProperties:
            type: object
            properties:
              complete: { type: boolean }
              missing: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        venue: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EventStatus" }
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Set while the event is archived; null otherwise.
        requires_check_out: { type: boolean }
        check_in_window_minutes: { type: integer }
        banner_urls: { $ref: "#/components/schemas/ImageUrls" }
        id_card_background_url:
          type: string
          format: uri
          nullable: true
          description: Public URL of the uploaded attendee-ID-card background image, if any.
        id_card_font_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#000000"
          nullable: true
          description: Hex color code (e.g. #000000) for attendee name text in generated ID cards. Defaults to #000000 if not set.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventSession:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        session_date: { type: string, format: date }
        start_time: { type: string, example: "08:00:00" }
        end_time: { type: string, example: "12:00:00" }
        check_in_opens_at:
          type: string
          format: date-time
          description: "Derived: session start minus the event's check_in_window_minutes."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventProgram:
      type: object
      description: "Master program record for an event session, containing an ordered list of program items."
      properties:
        id: { type: integer }
        event_id: { type: integer, description: "Foreign key to Event; one program per event." }
        items:
          type: array
          description: "Program items for this session, only present when explicitly eager-loaded."
          items: { $ref: "#/components/schemas/EventProgramItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventProgramItem:
      type: object
      description: "Individual program item: a talk, session, or participant entry within a program."
      properties:
        id: { type: integer }
        event_program_id: { type: integer, description: "Foreign key to EventProgram." }
        order: { type: integer, description: "Display order of the item (0-based)." }
        date: { type: string, format: date, description: "Date of this program item." }
        start_time: { type: string, example: "09:00", description: "Start time in H:i format." }
        end_time: { type: string, example: "10:00", nullable: true, description: "End time in H:i format, optional." }
        part_title: { type: string, nullable: true, maxLength: 255, description: "Title of this program segment." }
        part_subtitle: { type: string, nullable: true, maxLength: 255, description: "Subtitle or secondary title." }
        part_description: { type: string, nullable: true, description: "Description of the program segment." }
        participant_name: { type: string, nullable: true, maxLength: 255, description: "Name of participant or speaker." }
        participant_description: { type: string, nullable: true, description: "Bio or role of the participant." }
        participant_photo_urls:
          type: array
          description: "URLs to participant photos (original size); derived from photo_paths."
          items: { type: string, format: uri }
        part_remarks: { type: string, nullable: true, description: "Additional remarks or notes." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventRegistration:
      type: object
      description: The registration view of an Attendee row; `id` and `attendee_id` are the same value.
      properties:
        id: { type: integer }
        event_id: { type: integer }
        attendee_id: { type: integer }
        qr_token:
          type: string
          description: Opaque, random, non-guessable. Unique per registration, never reused. Treat as sensitive.
        id_card_ready:
          type: boolean
          description: Whether GenerateAttendeeIdCardJob has finished; false means GET .../id-card returns 202.
        id_card_generated_at:
          { type: string, format: date-time, nullable: true }
        registered_by:
          { type: integer, nullable: true, description: "User id." }
        registered_at: { type: string, format: date-time }
        attendee: { $ref: "#/components/schemas/Attendee" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IdCardGridDownload:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: integer }
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Job status. "pending" or "processing" = still generating. "completed" = ready to download. "failed" = see failure_reason.
        progress_percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress as a percentage (0-100). Updates during processing.
        registration_ids:
          type: array
          items: { type: integer }
          nullable: true
          description: Specific registration IDs included in this batch. Null means "all registrations with ready images".
        failure_reason:
          { type: string, nullable: true, description: "If status is 'failed', the reason why." }
        download_url:
          { type: string, format: uri, nullable: true, description: "Available only when status is 'completed'. URL to download the PDF." }
        completed_at:
          { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AttendanceRecord:
      type: object
      properties:
        id: { type: integer }
        attendee_id: { type: integer }
        event_registration_id:
          { type: integer, deprecated: true, description: "Alias of attendee_id. Removed in Release 2." }
        event_session_id: { type: integer }
        check_in_at: { type: string, format: date-time, nullable: true }
        check_out_at: { type: string, format: date-time, nullable: true }
        method: { $ref: "#/components/schemas/AttendanceMethod" }
        recorded_by: { type: integer, nullable: true, description: "User id." }
        attendee: { $ref: "#/components/schemas/EventRegistration" }
        event_registration:
          {
            deprecated: true,
            description: "Alias of `attendee`. Removed in Release 2.",
            allOf: [{ $ref: "#/components/schemas/EventRegistration" }],
          }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventSessionRoster:
      type: object
      properties:
        event_id: { type: integer }
        session_id: { type: integer }
        status:
          type: string
          enum: [all, present, absent]
          description: "The status filter that was applied."
        data:
          type: array
          items: { $ref: "#/components/schemas/EventSessionRosterEntry" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    EventSessionRosterEntry:
      type: object
      properties:
        attendee_id: { type: integer }
        event_registration_id:
          { type: integer, deprecated: true, description: "Alias of attendee_id. Removed in Release 2." }
        attendee_name: { type: string }
        attendee_photo_url: { type: string, nullable: true }
        union: { type: string, nullable: true }
        mission: { type: string, nullable: true }
        attendance_status: { type: string, enum: [Present, Absent] }
        check_in_at: { type: string, format: date-time, nullable: true }
        check_out_at: { type: string, format: date-time, nullable: true }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer, nullable: true }
        user:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        action: { type: string, example: "attendee.created" }
        auditable_type:
          { type: string, nullable: true, example: "App\\Models\\Attendee" }
        auditable_id: { type: integer, nullable: true }
        changes:
          type: object
          nullable: true
          additionalProperties: true
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    LogEntry:
      type: object
      description: A single Laravel log entry (one or more lines including stack traces)
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the log entry was recorded
        channel:
          type: string
          description: Log channel name (usually "laravel")
        level:
          type: string
          description: Log level (debug, info, notice, warning, error, critical, alert, emergency)
          enum: [debug, info, notice, warning, error, critical, alert, emergency]
        message:
          type: string
          description: The first line of the log entry (summary)
        raw:
          type: string
          description: Complete raw log text including multi-line stack traces and context

    PaginationLinks:
      type: object
      properties:
        first: { type: string, format: uri, nullable: true }
        last: { type: string, format: uri, nullable: true }
        prev: { type: string, format: uri, nullable: true }
        next: { type: string, format: uri, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Speaker:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: integer }
        name: { type: string }
        designation: { type: string }
        organization: { type: string }
        bio: { type: string }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        program_schedule:
          type: array
          items: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProgramNodeInput:
      type: object
      description: >
        Fields depend on `kind`. days: `title` (optional), `date` (Y-m-d, unique per program),
        `description`. sections: `title`, `start_time`, `end_time`, `description`. parts: `title`,
        `start_time`, `end_time`, `participant_name`, `speaker_id` (same event), `attendee_id`
        (same organization), `designation`, `details`. `parent_id` is required when creating a
        section or part.
      properties:
        parent_id: { type: integer }
        title: { type: string, maxLength: 255, nullable: true }
        date: { type: string, format: date }
        start_time: { type: string, example: "09:00", nullable: true }
        end_time: { type: string, example: "10:00", nullable: true }
        description: { type: string, maxLength: 10000, nullable: true }
        participant_name: { type: string, maxLength: 255, nullable: true }
        speaker_id: { type: integer, nullable: true }
        attendee_id: { type: integer, nullable: true }
        designation: { type: string, maxLength: 10000, nullable: true }
        details: { type: string, maxLength: 10000, nullable: true }
    EventAttendanceSummary:
      type: object
      properties:
        event_id: { type: integer }
        event_name: { type: string }
        total_registered: { type: integer }
        total_checked_in: { type: integer }
        total_checked_out: { type: integer }
        total_no_show: { type: integer }
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id: { type: integer }
              session_name: { type: string }
              session_date: { type: string, format: date }
              start_time: { type: string }
              end_time: { type: string }
              registered: { type: integer }
              checked_in: { type: integer }
              checked_out: { type: integer }
              no_show: { type: integer }
        attendance_records:
          type: object
          properties:
            data:
              type: array
              items: { type: object, additionalProperties: true }
            pagination:
              type: object
              properties:
                total: { type: integer }
                per_page: { type: integer }
                current_page: { type: integer }
                last_page: { type: integer }
                from: { type: integer }
                to: { type: integer }
    OrganizationAttendanceOverview:
      type: object
      properties:
        organization_id: { type: integer }
        organization_name: { type: string }
        total_events: { type: integer }
        total_registered: { type: integer }
        total_checked_in: { type: integer }
        total_checked_out: { type: integer }
        total_no_show: { type: integer }
        by_union:
          type: array
          items: { type: object, additionalProperties: true }
        by_mission:
          type: array
          items: { type: object, additionalProperties: true }
    AttendanceScanBatchItem:
      type: object
      required: [client_ref, event_id, session_id, method]
      properties:
        client_ref: { type: string, description: Client-side id echoed back in the result. }
        event_id: { type: integer }
        session_id: { type: integer }
        qr_token: { type: string, nullable: true }
        attendee_id: { type: integer, nullable: true }
        event_registration_id:
          {
            type: integer,
            nullable: true,
            deprecated: true,
            description: "Use attendee_id. Translated through legacy_registration_id; removed in Release 2.",
          }
        scanned_at: { type: string, example: "2026-10-22 09:15:00", nullable: true }
        method: { type: string, enum: [qr, manual] }
        override: { type: boolean }
    AttendanceScanBatchResult:
      type: object
      properties:
        client_ref: { type: string }
        status: { type: string, enum: [created, duplicate, error, event_archived] }
        message: { type: string }
        attendance_record_id: { type: integer, nullable: true }
    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Unauthenticated." }

    Forbidden:
      description: Authenticated, but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "This action is unauthorized." }

    ForbiddenOrArchived:
      description: >
        Not allowed to perform this action, or the event is archived. Archived events are
        read-only for every role, including Super Admin; the archived denial always has the
        message `This event is archived.`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unauthorized:
              value: { message: "This action is unauthorized." }
            archived:
              value: { message: "This event is archived." }

    NotFound:
      description: >
        Not found — either the record truly doesn't exist, or (for organization-scoped
        resources) it belongs to a different organization than the caller's.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

    AttendanceValidationFailed:
      description: >
        Validation failed. Notable business-rule messages (under the relevant field key):
        `"Already Checked In."`, `"Attendance for this session has not opened yet."`,
        `"This QR code is not registered for this event."`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

    DuplicateAttendees:
      description: "Potential duplicate attendees found; resubmit with `override_duplicate: true` to proceed anyway."
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              duplicates:
                type: array
                items: { $ref: "#/components/schemas/Attendee" }

    OrganizationItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Organization" }

    OrganizationList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    UserItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/User" }

    UserList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    UnionItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Union" }

    UnionList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Union" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    MissionItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Mission" }

    MissionList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Mission" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    ChurchItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Church" }

    ChurchList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Church" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    AttendeeItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Attendee" }
              event_stats:
                allOf: [{ $ref: "#/components/schemas/EventRegistrationStats" }]
                type: object
                nullable: true
                description: Registration stats for a specific event (only present if event_id query param was provided).

    AttendeeList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Attendee" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    EventItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Event" }

    EventList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    EventSessionItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/EventSession" }

    EventProgramItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/EventProgram" }

    EventProgramItemDetail:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/EventProgramItem" }

    EventRegistrationItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/EventRegistration" }

    EventRegistrationList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventRegistration" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    AttendanceRecordItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/AttendanceRecord" }
              incomplete: { type: boolean, description: "Present and true when the Attendee was registered once and is now incomplete (scan admitted)." }
              note: { type: string, description: "`Registration incomplete.` when `incomplete` is true." }

    AuditLogList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLog" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    AttendeeDashboardItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/AttendeeDashboard" }

    SpeakerItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Speaker" }

    SpeakerList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/Speaker" }

    ProgramNode:
      description: The day, section or part, depending on `kind`
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, additionalProperties: true }
