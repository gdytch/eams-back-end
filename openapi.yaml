openapi: 3.0.3
info:
  title: Event Attendance Management System (EAMS) API
  description: >
    API-only backend for the Event Attendance Management System. Multi-organization tenant
    model: every resource except `User` (Super Admins have no organization) is scoped to the
    caller's organization automatically — Super Admins see across all organizations, everyone
    else only ever sees their own. Cross-organization access to a scoped resource returns
    `404 Not Found` (not `403`), since the record is filtered out of the query entirely.
  version: "1.0.0"
servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Organizations
    description: Super Admin only.
  - name: Users
  - name: Territories
    description: Unions and Missions.
  - name: Attendees
  - name: Events
  - name: Event Sessions
  - name: Event Registrations
  - name: Attendance
  - name: Reports
  - name: Audit Logs

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    {
                      type: string,
                      description: "Sanctum personal access token — send as `Authorization: Bearer <token>` on every subsequent request.",
                    }
                  user: { $ref: "#/components/schemas/User" }
        "422":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Logged out." }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/sso/{provider}:
    post:
      tags: [Auth]
      summary: Single Sign-On via OAuth token exchange
      description: >
        Authenticate using OAuth credentials from Google, Microsoft, or Facebook.
        The client obtains an OAuth access token from the provider's native SDK
        and exchanges it with this endpoint for a Sanctum bearer token.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth provider name
          schema:
            type: string
            enum: [google, microsoft, facebook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: OAuth access token from the provider
                invite_token:
                  type: string
                  nullable: true
                  description: Optional event invite token to assign organization_id and trigger automated event registration
      responses:
        "201":
          description: New user created and authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Sanctum personal access token" }
                  user: { $ref: "#/components/schemas/User" }
                  is_new_user: { type: boolean, example: true }
        "200":
          description: Existing user authenticated (email match or identity link)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "Sanctum personal access token" }
                  user: { $ref: "#/components/schemas/User" }
                  is_new_user: { type: boolean, example: false }
        "401":
          description: Unable to verify SSO token with provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Unable to verify SSO token." }
        "404":
          description: Unknown provider
        "422":
          description: Provider did not return email or other validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /attendee/dashboard:
    get:
      tags: [Auth]
      summary: Get the authenticated attendee's dashboard
      description: >
        **Access Policy:** Attendee users only (self-scoped; all user roles with attendee profile can access).

        Returns self-scoped dashboard data including profile, account info, upcoming events (sorted by start date,
        soonest first) with next session details and QR token, past events (sorted by end date, most recent first)
        with attendance summaries, spotlight cards for next upcoming event and latest past event, and comprehensive
        statistics including attendance rate percentage. Returns an empty profile if the user has no linked Attendee
        master record yet.
      responses:
        "200": { $ref: "#/components/responses/AttendeeDashboardItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /dashboard:
    get:
      tags: [Reports]
      summary: Get the authenticated staff user's home dashboard (single entry point, shape varies by role)
      description: >
        **Access Policy:** Any authenticated staff user (`super_admin`, `org_admin`, `checker`).
        Attendee accounts get `403 Forbidden` — use `GET /attendee/dashboard` instead.

        This is the one-stop "home screen" endpoint the frontend should call right after login;
        the response body shape depends on the caller's `role` (see `discriminator`), so no prior
        knowledge of the user's role or organization id is required:

        - **`super_admin`** → [`SuperAdminHomeDashboard`](#/components/schemas/SuperAdminHomeDashboard):
          cross-organization totals, a top-5 organizations leaderboard (by registrations),
          the next 5 upcoming events platform-wide, a 5-event check-in rate trend, and the
          latest 10 audit log entries system-wide.
        - **`org_admin`** → [`OrgAdminHomeDashboard`](#/components/schemas/OrgAdminHomeDashboard):
          totals scoped to the caller's organization, today's scheduled sessions with live
          check-in/check-out progress, upcoming events, a 5-event check-in rate trend,
          registration breakdowns by union/mission, and the latest 10 audit log entries for
          the organization.
        - **`checker`** → [`CheckerHomeDashboard`](#/components/schemas/CheckerHomeDashboard):
          operational, scanning-focused view — whether the checker is restricted to specific
          events (`event_checker_access`) or has full org access, today's sessions to scan,
          upcoming events, and the checker's own scan activity (today/all-time counts plus the
          last 10 scans they personally recorded).

        All three variants share a common `role`, `user`, and `generated_at` envelope.
      responses:
        "200":
          description: OK — shape depends on `role`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SuperAdminHomeDashboard" }
                  - { $ref: "#/components/schemas/OrgAdminHomeDashboard" }
                  - { $ref: "#/components/schemas/CheckerHomeDashboard" }
                discriminator:
                  propertyName: role
                  mapping:
                    super_admin: "#/components/schemas/SuperAdminHomeDashboard"
                    org_admin: "#/components/schemas/OrgAdminHomeDashboard"
                    checker: "#/components/schemas/CheckerHomeDashboard"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Organizations
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      description: Super Admin only.
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/OrganizationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Organizations]
      summary: Create an organization
      description: Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, maxLength: 255 }
                code:
                  {
                    type: string,
                    maxLength: 50,
                    description: "Unique short code.",
                  }
                logo_path: { type: string, nullable: true }
                is_active: { type: boolean, default: true }
      responses:
        "201": { $ref: "#/components/responses/OrganizationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /organizations/{organization}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      summary: Get an organization
      responses:
        "200": { $ref: "#/components/responses/OrganizationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Organizations]
      summary: Update an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50 }
                logo_path: { type: string, nullable: true }
                is_active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/OrganizationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Organizations]
      summary: Delete an organization
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Super Admin sees all users; everyone else sees only their own organization's users.
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/UserList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Create a user
      description: >
        Super Admin or Org Admin only. `organization_id` is required when a Super Admin creates
        a non-Super-Admin user; otherwise it defaults to the actor's own organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role: { $ref: "#/components/schemas/UserRole" }
                organization_id: { type: integer, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get a user
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role: { $ref: "#/components/schemas/UserRole" }
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{user}/photo:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Upload a user's profile photo
      description: >
        Creates 4 WebP images (sm/md/lg/original) from the uploaded PNG/JPEG.
        Org Admin+ can upload photos for any user in their organization; users can upload their own.
        Supports both multipart file uploads and base64 input (with or without data-URI prefix).
        Decoded size must not exceed 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: PNG or JPEG image file
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  description: "Base64-encoded PNG/JPEG, optionally prefixed with data-URI (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Users]
      summary: Remove a user's profile photo
      description: Deletes all 4 image sizes. Org Admin+ can remove for their organization users; users can remove their own.
      responses:
        "200": { $ref: "#/components/responses/UserItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{user}/event-access:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Users]
      summary: Replace a Checker's restricted event list
      description: >
        Syncs the `event_checker_access` pivot for this user. An empty `event_ids` array means
        the Checker defaults back to full access to every event in their organization (this is
        also the default for a brand-new Checker with no rows at all). Super Admins and Org
        Admins always have full access regardless of this list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_ids]
              properties:
                event_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: The events the user is now restricted to (empty = unrestricted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ---------------------------------------------------------------- Unions
  /unions:
    get:
      tags: [Territories]
      summary: List unions
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/UnionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Territories]
      summary: Create a union
      description: "`organization_id` is required for Super Admins; otherwise defaults to the actor's organization."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                organization_id: { type: integer, nullable: true }
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/UnionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /unions/{union}:
    parameters:
      - $ref: "#/components/parameters/UnionId"
    get:
      tags: [Territories]
      summary: Get a union
      responses:
        "200": { $ref: "#/components/responses/UnionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Territories]
      summary: Update a union
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/UnionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Territories]
      summary: Delete a union
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Missions
  /missions:
    get:
      tags: [Territories]
      summary: List missions
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/MissionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Territories]
      summary: Create a mission
      description: "`union_id` must belong to the resolved organization. `organization_id` is required for Super Admins."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [union_id, name]
              properties:
                organization_id: { type: integer, nullable: true }
                union_id: { type: integer }
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "201": { $ref: "#/components/responses/MissionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /missions/{mission}:
    parameters:
      - $ref: "#/components/parameters/MissionId"
    get:
      tags: [Territories]
      summary: Get a mission
      responses:
        "200": { $ref: "#/components/responses/MissionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Territories]
      summary: Update a mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                union_id: { type: integer }
                name: { type: string, maxLength: 255 }
                code: { type: string, maxLength: 50, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/MissionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Territories]
      summary: Delete a mission
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Churches
  /churches:
    get:
      tags: [Territories]
      summary: List churches
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Churches list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChurchList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Territories]
      summary: Create a church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [union_id, mission_id, name]
              properties:
                organization_id: { type: integer }
                union_id: { type: integer }
                mission_id: { type: integer }
                name: { type: string, maxLength: 255 }
                address: { type: string, maxLength: 255, nullable: true }
      responses:
        "201":
          description: Church created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /churches/{churchId}:
    parameters:
      - $ref: "#/components/parameters/ChurchId"
    get:
      tags: [Territories]
      summary: Get a church
      responses:
        "200":
          description: Church details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Territories]
      summary: Update a church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id: { type: integer }
                union_id: { type: integer }
                mission_id: { type: integer }
                name: { type: string, maxLength: 255 }
                address: { type: string, maxLength: 255, nullable: true }
      responses:
        "200":
          description: Church updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChurchItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [Territories]
      summary: Delete a church
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Attendees
  /attendees:
    get:
      tags: [Attendees]
      summary: List / search attendees
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: search
          in: query
          description: Matches against first, middle, and last name (partial, case-insensitive).
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AttendeeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Attendees]
      summary: Create an attendee (master record)
      description: >
        Runs duplicate detection first (normalized first/middle/last name match, scoped to the
        organization). If matches are found and `override_duplicate` is not `true`, returns
        `409` with the candidate list instead of creating the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                organization_id:
                  {
                    type: integer,
                    nullable: true,
                    description: "Required for Super Admins.",
                  }
                union_id: { type: integer, nullable: true }
                mission_id: { type: integer, nullable: true }
                church_id: { type: integer, nullable: true }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100 }
                mobile_no: { type: string, maxLength: 20, nullable: true }
                email_address: { type: string, format: email, nullable: true }
                remarks: { type: string, nullable: true }
                override_duplicate: { type: boolean, default: false }
      responses:
        "201": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/DuplicateAttendees" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attendees/check-duplicates:
    get:
      tags: [Attendees]
      summary: Check for potential duplicate attendees by name (does not create anything)
      parameters:
        - name: first_name
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
        - name: middle_name
          in: query
          schema: { type: string, maxLength: 100 }
        - name: last_name
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/AttendeeList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /attendees/{attendee}:
    parameters:
      - $ref: "#/components/parameters/AttendeeId"
    get:
      tags: [Attendees]
      summary: Get an attendee
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /attendees/{attendee}/photo:
    parameters:
      - $ref: "#/components/parameters/AttendeeId"
    post:
      tags: [Attendees]
      summary: Upload an attendee's photo
      description: >
        Creates 4 WebP images (sm/md/lg/original) from the uploaded PNG/JPEG. Org Admin+ only.
        Supports both multipart file uploads and base64 input (with or without data-URI prefix).
        Decoded size must not exceed 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: PNG or JPEG image file
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  description: "Base64-encoded PNG/JPEG, optionally prefixed with data-URI (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Attendees]
      summary: Remove an attendee's photo
      description: Deletes all 4 image sizes. Org Admin+ only.
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [Attendees]
      summary: Update an attendee
      description: Does not re-run duplicate detection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                union_id: { type: integer, nullable: true }
                mission_id: { type: integer, nullable: true }
                church_id: { type: integer, nullable: true }
                first_name: { type: string, maxLength: 100 }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100 }
                mobile_no: { type: string, maxLength: 20, nullable: true }
                email_address: { type: string, format: email, nullable: true }
                remarks: { type: string, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/AttendeeItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Attendees]
      summary: Delete an attendee
      description: Org Admin+ only.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Events
  /events:
    get:
      tags: [Events]
      summary: List events
      description: >
        Checkers only see events they have access to: every event in their organization by
        default, or a restricted subset if `event_checker_access` rows exist for them (see
        `PUT /users/{user}/event-access`).
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200": { $ref: "#/components/responses/EventList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Events]
      summary: Create an event
      description: Org Admin+ only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, start_date, end_date]
              properties:
                organization_id:
                  {
                    type: integer,
                    nullable: true,
                    description: "Required for Super Admins.",
                  }
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                start_date: { type: string, format: date }
                end_date:
                  {
                    type: string,
                    format: date,
                    description: "Must be on/after start_date.",
                  }
                venue: { type: string, maxLength: 255, nullable: true }
                status: { $ref: "#/components/schemas/EventStatus" }
                requires_check_out: { type: boolean, default: false }
                check_in_window_minutes:
                  type: integer
                  default: 30
                  description: How many minutes before a session's start time check-in opens.
      responses:
        "201": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Get an event
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                venue: { type: string, maxLength: 255, nullable: true }
                status: { $ref: "#/components/schemas/EventStatus" }
                requires_check_out: { type: boolean }
                check_in_window_minutes: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Events]
      summary: Delete an event
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/banner:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Upload an event's banner image
      description: >
        Creates 4 WebP images (sm/md/lg/original) from the uploaded PNG/JPEG. Org Admin+ only.
        Supports both multipart file uploads and base64 input (with or without data-URI prefix).
        Decoded size must not exceed 10MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [banner]
              properties:
                banner:
                  type: string
                  format: binary
                  description: PNG or JPEG image file
          application/json:
            schema:
              type: object
              required: [banner]
              properties:
                banner:
                  type: string
                  description: "Base64-encoded PNG/JPEG, optionally prefixed with data-URI (e.g., 'data:image/png;base64,...')"
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Events]
      summary: Remove an event's banner image
      description: Deletes all 4 image sizes. Org Admin+ only.
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Event Sessions
  /events/{event}/sessions:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Sessions]
      summary: List an event's sessions
      description: Ordered by session_date then start_time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Event Sessions]
      summary: Create a session for an event
      description: Org Admin+ only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, session_date, start_time, end_time]
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                session_date: { type: string, format: date }
                start_time:
                  { type: string, example: "08:00", description: "H:i format." }
                end_time:
                  {
                    type: string,
                    example: "12:00",
                    description: "H:i format, must be after start_time.",
                  }
      responses:
        "201": { $ref: "#/components/responses/EventSessionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/sessions/{session}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Event Sessions]
      summary: Get a session
      responses:
        "200": { $ref: "#/components/responses/EventSessionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Event Sessions]
      summary: Update a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                session_date: { type: string, format: date }
                start_time: { type: string, example: "08:00" }
                end_time: { type: string, example: "12:00" }
      responses:
        "200": { $ref: "#/components/responses/EventSessionItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Event Sessions]
      summary: Delete a session
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/sessions/{session}/attendance:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Attendance]
      summary: List attendance records for a session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Event Registrations
  /events/{event}/registrations:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: List an event's registrations
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: search
          in: query
          description: Matches against the registered attendee's first/last name.
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/EventRegistrationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Event Registrations]
      summary: Register an attendee for the event
      description: >
        One call does either: (a) register an existing attendee — pass `attendee_id`; or
        (b) create a brand-new attendee (scoped to this event's organization) and register them
        in the same request — pass `first_name`/`last_name` (+ optional `middle_name`,
        `union_id`, `mission_id`). New-attendee creation runs the same duplicate-detection check
        as `POST /attendees` and returns `409` unless `override_duplicate` is `true`. A unique,
        non-guessable `qr_token` is generated for the new registration either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attendee_id:
                  {
                    type: integer,
                    nullable: true,
                    description: "Existing attendee. Mutually exclusive with first_name/last_name.",
                  }
                first_name: { type: string, maxLength: 100, nullable: true }
                middle_name: { type: string, maxLength: 100, nullable: true }
                last_name: { type: string, maxLength: 100, nullable: true }
                union_id: { type: integer, nullable: true }
                mission_id: { type: integer, nullable: true }
                override_duplicate: { type: boolean, default: false }
      responses:
        "201": { $ref: "#/components/responses/EventRegistrationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DuplicateAttendees" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/registrations/qr-export:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: Bulk-export QR codes as a PDF
      description: >
        Org Admin+ only. Generates a print-ready PDF with one QR code per registered attendee.
        Defaults to every registration on the event; pass `registration_ids[]` to export a
        subset. This action is recorded in the audit log.
      parameters:
        - name: registration_ids[]
          in: query
          schema:
            type: array
            items: { type: integer }
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{event}/registrations/id-cards/bulk-download:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: Bulk download identification cards for specified registrations
      description: >
        Download identification cards for specific attendees and merge them into a single PDF.
        Pass `registration_ids[]` as query parameters to specify which registrations to include.
        Only ready (already generated) ID cards are included; missing or pending cards are skipped.
        All PDFs are merged into a single document. This action is recorded in the audit log.
      parameters:
        - name: registration_ids[]
          in: query
          required: true
          schema:
            type: array
            items: { type: integer }
            minItems: 1
          description: Array of registration IDs to download
      responses:
        "200":
          description: Merged PDF file stream containing all requested identification cards
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: No ID cards are ready for download yet. Try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: No registration IDs provided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/id-cards/download-all:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Event Registrations]
      summary: Download all identification cards for the event
      description: >
        Download identification cards for all attendees registered to the event and merge them
        into a single PDF. Only ready (already generated) ID cards are included; missing or
        pending cards are skipped. This action is recorded in the audit log.
      responses:
        "200":
          description: Merged PDF file stream containing all identification cards for the event
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: No ID cards are ready for download yet. Try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/{registration}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    get:
      tags: [Event Registrations]
      summary: Get a registration
      description: Includes the `qr_token` — treat the response as sensitive.
      responses:
        "200": { $ref: "#/components/responses/EventRegistrationItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Event Registrations]
      summary: Unregister an attendee from the event
      description: Org Admin+ only. Also deletes any attendance records for this registration (cascade).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/{registration}/id-card:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    get:
      tags: [Event Registrations]
      summary: Download the attendee's identification card PDF
      description: >
        A `GenerateAttendeeIdCardJob` is automatically queued whenever a registration is created
        (`POST /events/{event}/registrations`); this endpoint downloads the result. 3in x 4in
        PDF: QR code centered, attendee name below, on the event's uploaded background
        image if one is set (see `POST /events/{event}/id-card-background`).
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "202":
          description: Still generating — retry shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/registrations/{registration}/id-card/regenerate:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/RegistrationId"
    post:
      tags: [Event Registrations]
      summary: Re-queue identification card generation
      description: Org Admin+ only. Useful after changing the event's background image.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Identification card generation has been queued.",
                    }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/id-card-background:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Upload (or replace) the attendee-ID-card background image
      description: Event admin (authorized via EventPolicy). Replaces any existing background.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [background]
              properties:
                background:
                  type: string
                  format: binary
                  description: "image/jpeg, image/png, or image/webp, max 10MB."
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Events]
      summary: Remove the attendee-ID-card background image
      description: Event admin (authorized via EventPolicy). Cards will fall back to a plain background.
      responses:
        "200": { $ref: "#/components/responses/EventItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Attendance
  /attendance/scan:
    post:
      tags: [Attendance]
      summary: Record attendance from a QR scan
      description: >
        Resolves the registration by `qr_token` scoped to `event_id`, then applies the same
        window/duplicate rules as manual attendance (see below).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, session_id, qr_token]
              properties:
                event_id: { type: integer }
                session_id: { type: integer }
                qr_token: { type: string }
                override:
                  type: boolean
                  default: false
                  description: "Org Admin+ only: bypass the check-in window for a past/future session correction. Ignored (and the early-window error still thrown) for Checkers."
      responses:
        "201": { $ref: "#/components/responses/AttendanceRecordItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/AttendanceValidationFailed" }

  /attendance/manual:
    post:
      tags: [Attendance]
      summary: Record attendance manually (fallback when QR scanning is unavailable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, session_id, event_registration_id]
              properties:
                event_id: { type: integer }
                session_id: { type: integer }
                event_registration_id: { type: integer }
                override:
                  type: boolean
                  default: false
                  description: "Org Admin+ only: bypass the check-in window."
      responses:
        "201": { $ref: "#/components/responses/AttendanceRecordItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/AttendanceValidationFailed" }

  /attendance/{attendanceRecord}/check-out:
    parameters:
      - $ref: "#/components/parameters/AttendanceRecordId"
    post:
      tags: [Attendance]
      summary: Record a check-out
      description: Only allowed when the event's `requires_check_out` flag is true.
      responses:
        "200": { $ref: "#/components/responses/AttendanceRecordItem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Event does not require check-out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  # ---------------------------------------------------------------- Audit Logs
  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries
      description: >
        Super Admin sees every entry across all organizations; Org Admin sees only their own
        organization's entries; Checkers are forbidden. Append-only — there is no write endpoint,
        entries are created internally whenever a tracked action happens (see `action` values
        below).
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: action
          in: query
          description: >
            Exact match. Known values: `attendee.created`, `attendee.updated`, `attendee.deleted`,
            `event_registration.created`, `event_registration.deleted`,
            `event_registration.qr_pdf_exported`, `attendance.checked_in`,
            `attendance.checked_in_override`, `attendance.checked_out`, `user.created`,
            `user.updated`, `user.deleted`, `organization.created`, `organization.updated`,
            `organization.deleted`.
          schema: { type: string }
        - name: auditable_type
          in: query
          description: 'Fully-qualified model class, e.g. `App\Models\Attendee`.'
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: integer }
        - name: from
          in: query
          description: Inclusive lower bound on created_at.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive upper bound on created_at.
          schema: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/AuditLogList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Reports
  /events/{event}/reports/attendance-summary:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Get attendance summary for an event
      description: >
        Aggregated counts per session and overall totals: registered, checked-in, checked-out,
        and no-show. Org Admin+ only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EventAttendanceSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/reports/attendance-summary/export:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Reports]
      summary: Export event attendance report
      description: >
        Export attendance data in Excel (xlsx) or PDF format. Pass `?format=pdf` or
        `?format=xlsx` (default: xlsx). Org Admin+ only.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, pdf]
            default: xlsx
      responses:
        "200":
          description: File stream (Excel or PDF depending on format parameter)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organization}/reports/dashboard:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      summary: Get organization dashboard with metrics and trends
      description: >
        **Access Policy:** Organization Admin or Super Admin only. Checkers are forbidden (403).
        Org Admins can only access their own organization's dashboard; cross-organization attempts return 404.
        Super Admin can access any organization's dashboard.

        Comprehensive organization dashboard: event counts by status, attendee and registration totals,
        latest event quick stats (registered, checked-in, checked-out, no-show, rates),
        next upcoming event spotlight, attendance rate trend (last 5 completed events),
        and registration breakdowns by union and mission.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organization}/reports/attendance-overview:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Reports]
      summary: Get organization-level attendance overview
      description: >
        Breakdown of attendance across all events by union and mission. Org Admin+ only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/OrganizationAttendanceOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Get global dashboard with cross-organization metrics
      description: >
        **Access Policy:** Super Admin only (403 Forbidden for all other roles: Org Admin, Checker, Attendee).

        Returns cross-organization totals (organizations, events by status, attendees, registrations)
        and a per-organization breakdown table. Used for high-level monitoring across all organizations.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/GlobalDashboard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Attendance (continued)
  /attendance/sync-batch:
    post:
      tags: [Attendance]
      summary: Process a batch of attendance scans with per-item error handling
      description: >
        Submit multiple scans (QR or manual) in a single request. Each scan is processed
        independently; partial failures do not affect other scans in the batch. Returns a
        per-item result array with status (created/duplicate/error) and message.
        `scanned_at` (optional, ISO 8601 format) allows offline clients to preserve the
        original scan time; if omitted, defaults to the current server time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    { $ref: "#/components/schemas/AttendanceScanBatchItem" }
      responses:
        "200":
          description: Batch processed (some or all scans may have failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      { $ref: "#/components/schemas/AttendanceScanBatchResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token, obtained from `POST /auth/login`.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    OrganizationId:
      {
        name: organization,
        in: path,
        required: true,
        schema: { type: integer },
      }
    UserId: { name: user, in: path, required: true, schema: { type: integer } }
    UnionId:
      { name: union, in: path, required: true, schema: { type: integer } }
    MissionId:
      { name: mission, in: path, required: true, schema: { type: integer } }
    ChurchId:
      { name: church, in: path, required: true, schema: { type: integer } }
    AttendeeId:
      { name: attendee, in: path, required: true, schema: { type: integer } }
    EventId:
      { name: event, in: path, required: true, schema: { type: integer } }
    SessionId:
      { name: session, in: path, required: true, schema: { type: integer } }
    RegistrationId:
      {
        name: registration,
        in: path,
        required: true,
        schema: { type: integer },
      }
    AttendanceRecordId:
      {
        name: attendanceRecord,
        in: path,
        required: true,
        schema: { type: integer },
      }

  schemas:
    UserRole:
      type: string
      enum: [super_admin, org_admin, checker]

    EventStatus:
      type: string
      enum: [draft, published, completed, cancelled]

    AttendanceMethod:
      type: string
      enum: [qr, manual]

    AttendanceMethodValue:
      type: string
      enum: [qr, manual]

    AttendanceSummary:
      type: object
      description: Attendance count summary for past events.
      properties:
        sessions_total: { type: integer, description: "Total sessions in the event" }
        sessions_attended: { type: integer, description: "Number of sessions attended (checked in)" }

    AttendeeProfileData:
      type: object
      nullable: true
      description: The Attendee master record linked to this user, if it exists.
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer, nullable: true }
        mission_id: { type: integer, nullable: true }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        full_name: { type: string }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        union:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        mission:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AttendeeAccountData:
      type: object
      description: The authenticated User record.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [attendee] }
        organization_id: { type: integer }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpcomingEventData:
      type: object
      description: Event registration data for an upcoming event.
      properties:
        registration_id: { type: integer, description: "EventRegistration id" }
        event: { $ref: "#/components/schemas/Event" }
        qr_token: { type: string, description: "Opaque token for QR code check-in" }
        id_card_ready: { type: boolean, description: "Whether the ID card has been generated" }
        id_card_url:
          type: string
          format: uri
          nullable: true
          description: "URL to download the ID card PDF, or null if not ready"
        next_session:
          type: object
          nullable: true
          description: "The earliest upcoming session, or null if all sessions have passed"
          properties:
            id: { type: integer }
            event_id: { type: integer }
            name: { type: string }
            description: { type: string, nullable: true }
            session_date: { type: string, format: date }
            start_time: { type: string, example: "08:00:00" }
            end_time: { type: string, example: "12:00:00" }
            check_in_opens_at: { type: string, format: date-time }
        days_until_start:
          type: integer
          nullable: true
          description: "Number of days until event start (in next_event spotlight only); null for regular upcoming_events list items"

    PastEventData:
      type: object
      description: Event registration data for a past event.
      properties:
        registration_id: { type: integer, description: "EventRegistration id" }
        event: { $ref: "#/components/schemas/Event" }
        attendance_summary: { $ref: "#/components/schemas/AttendanceSummary" }

    AttendeeStatsData:
      type: object
      description: Aggregate statistics for the attendee.
      properties:
        total_events_registered: { type: integer, description: "Total events the attendee is registered for" }
        total_upcoming_events: { type: integer, description: "Events with end_date >= today" }
        total_past_events: { type: integer, description: "Events with end_date < today" }
        total_sessions_attended: { type: integer, description: "Total sessions checked in to" }
        total_sessions_available: { type: integer, description: "Total sessions across past events" }
        attendance_rate: { type: number, format: float, description: "Percentage (0-100) of available sessions attended, rounded to 1 decimal" }

    AttendeeDashboard:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/AttendeeProfileData" }
        account: { $ref: "#/components/schemas/AttendeeAccountData" }
        upcoming_events:
          type: array
          items: { $ref: "#/components/schemas/UpcomingEventData" }
          description: "Sorted ascending by event start_date (soonest first)"
        past_events:
          type: array
          items: { $ref: "#/components/schemas/PastEventData" }
          description: "Sorted descending by event end_date (most recent first)"
        next_event:
          allOf: [{ $ref: "#/components/schemas/UpcomingEventData" }]
          nullable: true
          description: "Spotlight: the soonest upcoming event, with days_until_start included. Null if no upcoming events."
        latest_event:
          allOf: [{ $ref: "#/components/schemas/PastEventData" }]
          nullable: true
          description: "Spotlight: the most recent past event with attendance summary. Null if no past events."
        stats: { $ref: "#/components/schemas/AttendeeStatsData" }

    OrganizationDashboard:
      type: object
      description: Organization dashboard with metrics, trends, and breakdowns.
      properties:
        organization_id: { type: integer }
        organization_name: { type: string }
        events:
          type: object
          properties:
            total: { type: integer }
            draft: { type: integer }
            published: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            upcoming: { type: integer, description: "Events with start_date >= today and status != cancelled" }
            ongoing: { type: integer, description: "Events with start_date <= today and end_date >= today and status != cancelled" }
        attendees:
          type: object
          properties:
            total: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        latest_event:
          type: object
          nullable: true
          description: "Most recent completed event, or null if none exist. Falls back to most recent ended event by date."
          properties:
            id: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            venue: { type: string, nullable: true }
            stats:
              type: object
              properties:
                registered: { type: integer }
                checked_in: { type: integer }
                checked_out: { type: integer }
                no_show: { type: integer }
                check_in_rate: { type: number, format: float, description: "Percentage 0-100" }
                check_out_rate: { type: number, format: float, description: "Percentage 0-100" }
        next_upcoming_event:
          type: object
          nullable: true
          description: "Earliest event with start_date >= today and status in (draft, published), or null if none exist."
          properties:
            id: { type: integer }
            name: { type: string }
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            venue: { type: string, nullable: true }
            days_until_start: { type: integer }
            registrations_count: { type: integer }
        attendance_rate_trend:
          type: array
          description: "Last 5 completed events, ordered by end_date descending (most recent first)."
          items:
            type: object
            properties:
              event_id: { type: integer }
              event_name: { type: string }
              end_date: { type: string, format: date }
              registered: { type: integer }
              checked_in: { type: integer }
              rate: { type: number, format: float, description: "Check-in percentage 0-100" }
        breakdown_by_union:
          type: object
          description: "Registration counts keyed by union name (or 'No Union')"
          additionalProperties:
            type: integer
        breakdown_by_mission:
          type: object
          description: "Registration counts keyed by mission name (or 'No Mission')"
          additionalProperties:
            type: integer

    GlobalDashboard:
      type: object
      description: Global dashboard for SuperAdmin (cross-organization view).
      properties:
        organizations:
          type: object
          properties:
            total: { type: integer, description: "Total organizations across the system" }
            active: { type: integer, description: "Organizations with is_active = true" }
        events:
          type: object
          description: "Event counts across all organizations by status"
          properties:
            total: { type: integer }
            draft: { type: integer }
            published: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            upcoming: { type: integer }
            ongoing: { type: integer }
        attendees:
          type: object
          properties:
            total: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        by_organization:
          type: array
          description: "Per-organization breakdown table"
          items:
            type: object
            properties:
              organization_id: { type: integer }
              organization_name: { type: string }
              total_events: { type: integer }
              total_attendees: { type: integer }
              total_registrations: { type: integer }

    HomeDashboardUser:
      type: object
      description: Common authenticated-user envelope shared by all `/dashboard` role variants.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        organization_id: { type: integer, nullable: true, description: "Always null for super_admin." }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }

    HomeDashboardEventCounts:
      type: object
      description: Event counts by status, scoped to whatever set of events the dashboard variant covers.
      properties:
        total: { type: integer }
        draft: { type: integer }
        published: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        upcoming: { type: integer, description: "start_date >= today and status != cancelled" }
        ongoing: { type: integer, description: "start_date <= today and end_date >= today and status != cancelled" }

    HomeDashboardUpcomingEvent:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        venue: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EventStatus" }
        registrations_count: { type: integer }
        days_until_start: { type: integer }

    HomeDashboardTodaySession:
      type: object
      description: A session scheduled for today, with live check-in/check-out progress.
      properties:
        id: { type: integer }
        event_id: { type: integer }
        event_name: { type: string }
        name: { type: string }
        start_time: { type: string, example: "08:00:00" }
        end_time: { type: string, example: "12:00:00" }
        check_in_opens_at: { type: string, format: date-time }
        registered:
          type: integer
          description: "Total registrations for the parent event (shared across all of its sessions)."
        checked_in: { type: integer }
        checked_out: { type: integer }

    HomeDashboardAttendanceTrendItem:
      type: object
      properties:
        event_id: { type: integer }
        event_name: { type: string }
        end_date: { type: string, format: date }
        registered: { type: integer }
        checked_in: { type: integer }
        rate: { type: number, format: float, description: "Check-in percentage 0-100" }

    HomeDashboardRecentActivityItem:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, example: "attendee.created" }
        user: { type: string, nullable: true, description: "Name of the actor, or null for system actions." }
        auditable_type: { type: string, nullable: true, description: "Class basename, e.g. \"Attendee\"." }
        created_at: { type: string, format: date-time }

    SuperAdminHomeDashboard:
      type: object
      description: "`/dashboard` response for role = super_admin: cross-organization overview."
      properties:
        role: { type: string, enum: [super_admin] }
        user: { $ref: "#/components/schemas/HomeDashboardUser" }
        generated_at: { type: string, format: date-time }
        organizations:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer, description: "is_active = true" }
            inactive: { type: integer, description: "is_active = false" }
        events: { $ref: "#/components/schemas/HomeDashboardEventCounts" }
        attendees:
          type: object
          properties:
            total: { type: integer }
        users:
          type: object
          description: "Staff user counts across all organizations, by role."
          properties:
            total: { type: integer }
            super_admins: { type: integer }
            org_admins: { type: integer }
            checkers: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        top_organizations:
          type: array
          description: "Top 5 organizations by total registrations, descending."
          items:
            type: object
            properties:
              organization_id: { type: integer }
              organization_name: { type: string }
              total_events: { type: integer }
              total_attendees: { type: integer }
              total_registrations: { type: integer }
        next_upcoming_event:
          allOf: [{ $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }]
          nullable: true
          description: "Spotlight: soonest of upcoming_events, or null if none exist."
        upcoming_events:
          type: array
          description: "Next 5 upcoming events platform-wide, ordered by start_date ascending."
          items: { $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }
        attendance_rate_trend:
          type: array
          description: "Last 5 completed events platform-wide, ordered by end_date descending."
          items: { $ref: "#/components/schemas/HomeDashboardAttendanceTrendItem" }
        recent_activity:
          type: array
          description: "Latest 10 audit log entries system-wide, most recent first."
          items: { $ref: "#/components/schemas/HomeDashboardRecentActivityItem" }

    OrgAdminHomeDashboard:
      type: object
      description: "`/dashboard` response for role = org_admin: overview scoped to the caller's organization."
      properties:
        role: { type: string, enum: [org_admin] }
        user: { $ref: "#/components/schemas/HomeDashboardUser" }
        generated_at: { type: string, format: date-time }
        organization:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            code: { type: string }
            logo_url: { type: string, format: uri, nullable: true }
        events: { $ref: "#/components/schemas/HomeDashboardEventCounts" }
        attendees:
          type: object
          properties:
            total: { type: integer }
        users:
          type: object
          description: "Staff user counts within the organization, by role."
          properties:
            total: { type: integer }
            org_admins: { type: integer }
            checkers: { type: integer }
        unions:
          type: object
          properties:
            total: { type: integer }
        missions:
          type: object
          properties:
            total: { type: integer }
        registrations:
          type: object
          properties:
            total: { type: integer }
        next_upcoming_event:
          allOf: [{ $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }]
          nullable: true
          description: "Spotlight: soonest of upcoming_events, or null if none exist."
        upcoming_events:
          type: array
          description: "Next 5 upcoming events for the organization, ordered by start_date ascending."
          items: { $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }
        today_sessions:
          type: array
          description: "Sessions scheduled for today across the organization's events, ordered by start_time ascending."
          items: { $ref: "#/components/schemas/HomeDashboardTodaySession" }
        attendance_rate_trend:
          type: array
          description: "Last 5 completed events for the organization, ordered by end_date descending."
          items: { $ref: "#/components/schemas/HomeDashboardAttendanceTrendItem" }
        breakdown_by_union:
          type: object
          description: "Registration counts keyed by union name (or 'No Union')."
          additionalProperties: { type: integer }
        breakdown_by_mission:
          type: object
          description: "Registration counts keyed by mission name (or 'No Mission')."
          additionalProperties: { type: integer }
        recent_activity:
          type: array
          description: "Latest 10 audit log entries for the organization, most recent first."
          items: { $ref: "#/components/schemas/HomeDashboardRecentActivityItem" }

    CheckerHomeDashboard:
      type: object
      description: "`/dashboard` response for role = checker: operational, scanning-focused overview."
      properties:
        role: { type: string, enum: [checker] }
        user: { $ref: "#/components/schemas/HomeDashboardUser" }
        generated_at: { type: string, format: date-time }
        access_restricted:
          type: boolean
          description: >
            Whether this checker has explicit event_checker_access rows (true = restricted to
            accessible_events_count events only; false = full organization access, the default).
        accessible_events_count: { type: integer }
        upcoming_events:
          type: array
          description: "Next 5 upcoming accessible events, ordered by start_date ascending."
          items: { $ref: "#/components/schemas/HomeDashboardUpcomingEvent" }
        today_sessions:
          type: array
          description: "Sessions scheduled for today across accessible events, ordered by start_time ascending."
          items: { $ref: "#/components/schemas/HomeDashboardTodaySession" }
        my_scan_stats:
          type: object
          description: "Attendance records personally recorded (checked in or manually marked) by this checker."
          properties:
            today: { type: integer }
            total: { type: integer, description: "All-time count." }
        recent_scans:
          type: array
          description: "Last 10 attendance records recorded by this checker, most recent first."
          items:
            type: object
            properties:
              id: { type: integer }
              attendee_name: { type: string }
              event_id: { type: integer }
              event_name: { type: string }
              session_name: { type: string, nullable: true }
              method: { $ref: "#/components/schemas/AttendanceMethod" }
              check_in_at: { type: string, format: date-time, nullable: true }
              check_out_at: { type: string, format: date-time, nullable: true }

    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        logo_path: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        organization_id:
          {
            type: integer,
            nullable: true,
            description: "Always null for super_admin.",
          }
        organization:
          allOf: [{ $ref: "#/components/schemas/Organization" }]
          description: Only present when explicitly eager-loaded server-side.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Union:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        name: { type: string }
        code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Mission:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer }
        name: { type: string }
        code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Church:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer }
        mission_id: { type: integer }
        name: { type: string }
        address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImageUrls:
      type: object
      description: URLs for 4 WebP image sizes. All are null if photo/banner was never uploaded.
      properties:
        sm: { type: string, format: uri, nullable: true, description: "480px width" }
        md: { type: string, format: uri, nullable: true, description: "1024px width" }
        lg: { type: string, format: uri, nullable: true, description: "1920px width" }
        original: { type: string, format: uri, nullable: true, description: "Up to 3000px width, maintains aspect ratio" }

    Attendee:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        union_id: { type: integer, nullable: true }
        mission_id: { type: integer, nullable: true }
        church_id: { type: integer, nullable: true }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        full_name:
          {
            type: string,
            description: "Derived: first + middle + last, trimmed.",
          }
        photo_urls: { $ref: "#/components/schemas/ImageUrls" }
        union: { $ref: "#/components/schemas/Union" }
        mission: { $ref: "#/components/schemas/Mission" }
        church: { $ref: "#/components/schemas/Church" }
        mobile_no: { type: string, maxLength: 20, nullable: true }
        email_address: { type: string, format: email, nullable: true }
        remarks: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        venue: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EventStatus" }
        requires_check_out: { type: boolean }
        check_in_window_minutes: { type: integer }
        banner_urls: { $ref: "#/components/schemas/ImageUrls" }
        id_card_background_url:
          type: string
          format: uri
          nullable: true
          description: Public URL of the uploaded attendee-ID-card background image, if any.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventSession:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        session_date: { type: string, format: date }
        start_time: { type: string, example: "08:00:00" }
        end_time: { type: string, example: "12:00:00" }
        check_in_opens_at:
          type: string
          format: date-time
          description: "Derived: session start minus the event's check_in_window_minutes."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventRegistration:
      type: object
      properties:
        id: { type: integer }
        event_id: { type: integer }
        attendee_id: { type: integer }
        qr_token:
          type: string
          description: Opaque, random, non-guessable. Unique per registration, never reused. Treat as sensitive.
        id_card_ready:
          type: boolean
          description: Whether GenerateAttendeeIdCardJob has finished; false means GET .../id-card returns 202.
        id_card_generated_at:
          { type: string, format: date-time, nullable: true }
        registered_by:
          { type: integer, nullable: true, description: "User id." }
        registered_at: { type: string, format: date-time }
        attendee: { $ref: "#/components/schemas/Attendee" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AttendanceRecord:
      type: object
      properties:
        id: { type: integer }
        event_registration_id: { type: integer }
        event_session_id: { type: integer }
        check_in_at: { type: string, format: date-time, nullable: true }
        check_out_at: { type: string, format: date-time, nullable: true }
        method: { $ref: "#/components/schemas/AttendanceMethod" }
        recorded_by: { type: integer, nullable: true, description: "User id." }
        event_registration: { $ref: "#/components/schemas/EventRegistration" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: integer, nullable: true }
        user:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        action: { type: string, example: "attendee.created" }
        auditable_type:
          { type: string, nullable: true, example: "App\\Models\\Attendee" }
        auditable_id: { type: integer, nullable: true }
        changes:
          type: object
          nullable: true
          additionalProperties: true
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, format: uri, nullable: true }
        last: { type: string, format: uri, nullable: true }
        prev: { type: string, format: uri, nullable: true }
        next: { type: string, format: uri, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "Unauthenticated." }

    Forbidden:
      description: Authenticated, but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { message: "This action is unauthorized." }

    NotFound:
      description: >
        Not found — either the record truly doesn't exist, or (for organization-scoped
        resources) it belongs to a different organization than the caller's.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

    AttendanceValidationFailed:
      description: >
        Validation failed. Notable business-rule messages (under the relevant field key):
        `"Already Checked In."`, `"Attendance for this session has not opened yet."`,
        `"This QR code is not registered for this event."`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }

    DuplicateAttendees:
      description: "Potential duplicate attendees found; resubmit with `override_duplicate: true` to proceed anyway."
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              duplicates:
                type: array
                items: { $ref: "#/components/schemas/Attendee" }

    OrganizationItem:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Organization" }

    OrganizationList:
      description: OK
