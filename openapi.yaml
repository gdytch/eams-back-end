        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
              - type: object
                properties:
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

    UserItem:
